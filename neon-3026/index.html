    ctx.globalAlpha = CFG.flash ? 0.55 : 0.45 + 0.3 * Math.sin(G.t * 4);
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  drawUI();
  drawBanner();
  drawAlert();
  drawWarning();

  // Screens and menus. Buttons register themselves for taps and keys.
  var key = G.overlay || (G.paused ? 'pause' : G.state);
  if (key !== UI.lastKey) { UI.lastKey = key; UI.focus = 0; }
  UI.hot = []; UI.list = [];
  if (G.state === 'menu' && !G.overlay) drawMenu();
  if (G.state === 'continue') drawContinue();
  if (G.state === 'entry') drawEntry();
  if (G.state === 'gameover' && !G.overlay) drawGameOver();
  if (G.paused && !G.overlay) drawPauseMenu();
  if (G.overlay === 'settings') drawSettings();
  else if (G.overlay === 'scores') drawScores();
  if (UI.list.length) UI.focus = clamp(UI.focus, 0, UI.list.length - 1);
  drawButtons();

  ctx.restore();

  if (FX > 0) drawFrameEdges();
}

// Arcade frame: darken the sides and draw neon rails.
function drawFrameEdges() {
  ctx.save();
  ctx.fillStyle = 'rgba(3,4,10,0.55)';
  ctx.fillRect(0, 0, FX, H);
  ctx.fillRect(FX + W, 0, SW - FX - W, H);
  ctx.globalCompositeOperation = 'lighter';
  var a = 0.5 + 0.15 * Math.sin(G.t * 2);
  ctx.strokeStyle = 'rgba(0,240,255,' + a + ')';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(FX - 1, 0); ctx.lineTo(FX - 1, H);
  ctx.moveTo(FX + W + 1, 0); ctx.lineTo(FX + W + 1, H);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,62,200,' + a * 0.5 + ')';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.restore();
}

// Warning lines: kamikaze lock-on and sniper laser sight.
function drawTelegraphs() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (e.dead) continue;
    if (e.kind === 'diver' && e.phase === 'lock') {
      var pulse = 0.35 + 0.35 * Math.sin(G.t * 30);
      ctx.strokeStyle = 'rgba(255,235,80,' + pulse + ')';
      ctx.lineWidth = 1.5;
      if (ctx.setLineDash) ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.tx, e.ty);
      ctx.stroke();
      if (ctx.setLineDash) ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(e.tx, e.ty, 16, 0, TAU);
      ctx.stroke();
    } else if (e.kind === 'sniper' && e.aiming && e.ax !== undefined) {
      var dx = e.ax - e.x, dy = e.ay - e.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var hot = e.fireCd < 0.18;
      ctx.strokeStyle = hot ? 'rgba(210,255,210,0.9)' : 'rgba(120,255,140,0.35)';
      ctx.lineWidth = hot ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + dx / L * 2400, e.y + dy / L * 2400);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlayer() {
  if (!P.alive) return;
  var blink = !CFG.flash && P.invuln > 0 && Math.floor(P.invuln * 12) % 2 === 0;

  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(P.tilt);

  ctx.globalCompositeOperation = 'lighter';
  if (P.roll > 0) drawGlow('170,240,255', 0, 0, 84, 0.5 * Math.sin((1 - P.roll / ROLL_TIME) * Math.PI));
  drawGlow('0,200,255', 0, 12, 46, 0.55);
  ctx.globalCompositeOperation = 'source-over';

  ctx.scale(rollScale(), 1);

  ctx.globalCompositeOperation = 'lighter';
  var f = 10 + Math.random() * 10;
  ctx.beginPath();
  ctx.moveTo(-6, 10); ctx.lineTo(0, 10 + f); ctx.lineTo(6, 10);
  ctx.closePath();
  ctx.fillStyle = 'rgba(120,240,255,0.9)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  if (P.shield > 0) {
    ctx.strokeStyle = 'rgba(80,255,180,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, P.r + 10 + Math.sin(G.t * 8) * 2, 0, TAU);
    ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('80,255,180', 0, 0, P.r * 3, 0.3);
    ctx.globalCompositeOperation = 'source-over';
  }

  if (!blink) {
    if (CFG.flash && P.invuln > 0) ctx.globalAlpha = 0.45;
    CRAFT.player(ctx);
    ctx.fillStyle = '#0a2a3a';
    ctx.fill();
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(4, -4);
    ctx.lineTo(0, 0);
    ctx.lineTo(-4, -4);
    ctx.closePath();
    ctx.fillStyle = 'rgba(160,255,255,0.8)';
    ctx.fill();
  }

  ctx.restore();
}

function drawWings() {
  if (!P.alive || !wings.length) return;
  var blinkAll = !CFG.flash && P.invuln > 0 && Math.floor(P.invuln * 12) % 2 === 0;
  var SC = 0.62, rs = rollScale();

  for (var i = 0; i < wings.length; i++) {
    var w = wings[i];
    var blink = blinkAll || (!CFG.flash && w.inv > 0 && Math.floor(w.inv * 14) % 2 === 0);

    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(P.tilt);
    ctx.scale(rs, 1);

    ctx.globalCompositeOperation = 'lighter';
    drawGlow(WING_RGB, 0, 8, 30, 0.45);
    var fl = 6 + Math.random() * 6;
    ctx.beginPath();
    ctx.moveTo(-4, 6); ctx.lineTo(0, 6 + fl); ctx.lineTo(4, 6);
    ctx.closePath();
    ctx.fillStyle = 'rgba(140,255,215,0.85)';
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    if (w.shield > 0) {
      ctx.strokeStyle = 'rgba(80,255,180,0.65)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, WING_R + 7 + Math.sin(G.t * 8 + i) * 1.5, 0, TAU);
      ctx.stroke();
    }

    if (!blink) {
      ctx.scale(SC, SC);
      CRAFT.player(ctx);
      ctx.fillStyle = '#08281f';
      ctx.fill();
      ctx.strokeStyle = '#5ff2c8';
      ctx.lineWidth = 1.5 / SC;
      ctx.stroke();
    }

    ctx.restore();
  }
}

function drawEnemy(e) {
  var ds = e.ds || 1;
  var k = e.kind;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(ds, ds);

  var flash = e.flash > 0;
  var j;

  ctx.globalCompositeOperation = 'lighter';
  drawGlow(e.glow, 0, 0, e.br * 3.2, 0.45);
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = flash ? '#fff' : 'rgba(' + e.glow + ',0.85)';
  ctx.strokeStyle = flash ? '#fff' : 'rgb(' + e.glow + ')';
  ctx.lineWidth = 2 / Math.sqrt(ds);

  if (k !== 'boss' && k !== 'battleship') {
    var rot = 0;
    if (k === 'fighter' || k === 'diver' || k === 'sniper') {
      rot = (e.heading !== undefined ? e.heading : Math.PI / 2) + Math.PI / 2;
    } else if (k === 'mine') rot = e.t * 1.6;
    else if (k === 'splitter') rot = Math.sin(e.t * 2) * 0.2;
    ctx.rotate(rot);

    CRAFT[k](ctx);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    if (k === 'drone') {
      ctx.moveTo(0, -6); ctx.lineTo(6, 0); ctx.lineTo(0, 6); ctx.lineTo(-6, 0);
      ctx.closePath();
    } else if (k === 'fighter') {
      ctx.arc(0, -2, 4, 0, TAU);
    } else if (k === 'tank') {
      ctx.arc(0, 0, 7, 0, TAU);
    } else if (k === 'diver') {
      if (e.phase === 'lock') ctx.fillStyle = '#ffef6a';
      ctx.arc(0, -2, 3.5, 0, TAU);
    } else if (k === 'sniper') {
      if (e.aiming) ctx.fillStyle = '#d6ffd6';
      ctx.arc(0, -6, 3, 0, TAU);
    } else if (k === 'splitter') {
      ctx.moveTo(0, -7); ctx.lineTo(7, 0); ctx.lineTo(0, 7); ctx.lineTo(-7, 0);
      ctx.closePath();
    } else if (k === 'minelayer') {
      ctx.rect(-15, -6, 6, 6); ctx.rect(-3, -6, 6, 6); ctx.rect(9, -6, 6, 6);
    } else if (k === 'mine') {
      if (e.fuse < 1.5 && Math.floor(e.fuse * 10) % 2 === 0) ctx.fillStyle = '#ff5';
      ctx.arc(0, 0, 4, 0, TAU);
    }
    ctx.fill();

    if (k === 'splitter') {
      // Seam line hints that it breaks in two.
      ctx.strokeStyle = 'rgba(5,6,15,0.85)';
      ctx.lineWidth = 2 / ds;
      ctx.beginPath();
      ctx.moveTo(0, -17); ctx.lineTo(0, 17);
      ctx.stroke();
    }
  } else if (k === 'boss') {
    var rage = e.enraged;
    ctx.beginPath();
    ctx.moveTo(0, 50); ctx.lineTo(40, 20); ctx.lineTo(70, -10); ctx.lineTo(40, -30);
    ctx.lineTo(0, -20); ctx.lineTo(-40, -30); ctx.lineTo(-70, -10); ctx.lineTo(-40, 20);
    ctx.closePath();
    ctx.fillStyle = flash ? '#fff' : (rage ? 'rgba(50,8,16,0.92)' : 'rgba(30,10,20,0.9)');
    ctx.fill();
    ctx.strokeStyle = flash ? '#fff' : (rage && !CFG.flash && Math.floor(e.t * 8) % 2 === 0 ? '#ffd0d8' : '#ff3e5a');
    ctx.lineWidth = 3 / ds;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, (rage ? 19 : 16) + Math.sin(e.t * (rage ? 12 : 6)) * (rage ? 5 : 3), 0, TAU);
    ctx.fillStyle = flash ? '#fff' : 'rgba(255,70,90,0.9)';
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('255,70,90', 0, 0, rage ? 90 : 60, rage ? 1 : 0.8);
    ctx.globalCompositeOperation = 'source-over';
  } else if (k === 'battleship') {
    var flameRGB = e.enraged ? 'rgba(255,130,100,0.9)' : 'rgba(130,205,255,0.85)';
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.enraged ? '255,90,90' : '90,170,255', 0, -58, 130, 0.4);
    for (j = -1; j <= 1; j++) {
      var fl = 16 + Math.random() * 18;
      ctx.beginPath();
      ctx.moveTo(j * 20 - 7, -66);
      ctx.lineTo(j * 20, -66 - fl);
      ctx.lineTo(j * 20 + 7, -66);
      ctx.closePath();
      ctx.fillStyle = flameRGB;
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.beginPath();
    ctx.moveTo(0, 88);
    ctx.lineTo(24, 56);
    ctx.lineTo(28, 22);
    ctx.lineTo(64, -4);
    ctx.lineTo(58, -46);
    ctx.lineTo(28, -68);
    ctx.lineTo(-28, -68);
    ctx.lineTo(-58, -46);
    ctx.lineTo(-64, -4);
    ctx.lineTo(-28, 22);
    ctx.lineTo(-24, 56);
    ctx.closePath();
    ctx.fillStyle = flash ? '#fff' : 'rgba(12,24,44,0.96)';
    ctx.fill();
    ctx.strokeStyle = flash ? '#fff' : '#4ad8ff';
    ctx.lineWidth = 2.5 / ds;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(74,216,255,0.3)';
    ctx.lineWidth = 1 / ds;
    ctx.beginPath();
    ctx.moveTo(-18, -58); ctx.lineTo(-18, 40);
    ctx.moveTo(18, -58); ctx.lineTo(18, 40);
    ctx.stroke();

    ctx.fillStyle = flash ? '#fff' : 'rgba(28,58,92,0.95)';
    ctx.strokeStyle = flash ? '#fff' : 'rgba(120,220,255,0.9)';
    ctx.lineWidth = 1.5 / ds;
    ctx.beginPath();
    ctx.rect(-14, -46, 28, 42);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = flash ? '#fff' : 'rgba(255,180,60,0.9)';
    ctx.fillRect(-9, -40, 18, 6);

    for (j = 0; j < e.turrets.length; j++) {
      var T = e.turrets[j];
      var tx = T.x, ty = T.y;
      if (T.hp > 0) {
        var tf = flash || T.flash > 0;
        ctx.beginPath();
        ctx.arc(tx, ty, 11, 0, TAU);
        ctx.fillStyle = tf ? '#fff' : 'rgba(18,42,70,1)';
        ctx.fill();
        ctx.strokeStyle = tf ? '#fff' : '#7ef9ff';
        ctx.lineWidth = 2 / ds;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tx - 4, ty + 6); ctx.lineTo(tx - 4, ty + 24);
        ctx.moveTo(tx + 4, ty + 6); ctx.lineTo(tx + 4, ty + 24);
        ctx.strokeStyle = tf ? '#fff' : 'rgba(160,240,255,0.9)';
        ctx.lineWidth = 2.5 / ds;
        ctx.stroke();
      } else {
        // Wrecked turret: charred crater with a glowing ember.
        ctx.beginPath();
        ctx.arc(tx, ty, 11, 0, TAU);
        ctx.fillStyle = 'rgba(30,12,12,0.95)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,90,60,0.55)';
        ctx.lineWidth = 1.5 / ds;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tx - 7, ty - 5); ctx.lineTo(tx + 2, ty + 1); ctx.lineTo(tx + 8, ty - 3);
        ctx.moveTo(tx - 2, ty + 1); ctx.lineTo(tx - 4, ty + 8);
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow('255,90,40', tx, ty, 26 + Math.sin(e.t * 7 + j) * 4, 0.6);
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.enraged ? '255,70,70' : '255,120,60', 0, 0, 46 + Math.sin(e.t * (e.enraged ? 10 : 5)) * 8, 0.7);
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.restore();
}

function drawPowerup(p) {
  drawPuIcon(p.type, p.x, p.y, 10, p.t * 2);
}

// Power-up box: s = half-size, rot = spin of the box (the letter stays upright).
function drawPuIcon(type, x, y, s, rot) {
  var col = PU_RGB[type] || '120,255,255';
  ctx.save();
  ctx.translate(x, y);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(col, 0, 0, s * 4, 0.6);
  ctx.globalCompositeOperation = 'source-over';

  ctx.rotate(rot);
  ctx.strokeStyle = 'rgb(' + col + ')';
  ctx.lineWidth = Math.max(2, s * 0.18);
  ctx.strokeRect(-s, -s, s * 2, s * 2);
  ctx.fillStyle = 'rgba(' + col + ',0.2)';
  ctx.fillRect(-s, -s, s * 2, s * 2);

  ctx.rotate(-rot);
  ctx.fillStyle = 'rgb(' + col + ')';
  ctx.font = font(700, s * 1.4);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(type, 0, s * 0.1);
  ctx.restore();
}

function drawUI() {
  if (G.state === 'menu') return;

  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = '700 16px ui-monospace, Menlo, monospace';
  ctx.fillStyle = '#7ef9ff';
  ctx.fillText('SCORE ' + fmt(G.score), 16, 14);

  ctx.font = '700 12px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(160,220,255,0.7)';
  ctx.fillText('SECTOR ' + G.sector + ' · WAVE ' + G.wave, 16, 36);

  // Combo meter
  if (G.combo >= 2) {
    var m = comboMult();
    ctx.fillStyle = m >= 2 ? '#ffd76a' : 'rgba(255,220,140,0.85)';
    ctx.fillText('COMBO ' + G.combo + '  x' + m.toFixed(1), 16, 54);
    ctx.fillStyle = 'rgba(255,220,140,0.2)';
    ctx.fillRect(16, 70, 96, 3);
    ctx.fillStyle = 'rgba(255,220,140,0.9)';
    ctx.fillRect(16, 70, 96 * clamp(G.comboT / COMBO_TIME, 0, 1), 3);
  }

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(160,220,255,0.7)';
  ctx.fillText('BEST ' + fmt(G.best), W - 16, 14);

  for (var i = 0; i < G.lives; i++) drawMiniShip(W - 20 - i * 22, 40);

  // Status: weapon level pips, then shield and wingmen.
  if (G.state === 'playing') {
    var sy = 56, px0 = W - 16;
    for (i = 0; i < 5; i++) {
      ctx.fillStyle = (4 - i) < P.power ? '#7ef9ff' : 'rgba(126,249,255,0.18)';
      ctx.fillRect(px0 - (i + 1) * 9 + 3, sy, 6, 10);
    }
    ctx.font = font(700, 10);
    ctx.fillStyle = 'rgba(160,220,255,0.6)';
    ctx.fillText('PWR', px0 - 5 * 9 - 4, sy);
    var cur = px0, sy2 = sy + 22;
    if (P.shield > 0) {
      ctx.strokeStyle = 'rgba(80,255,180,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cur - 6, sy2, 6, 0, TAU); ctx.stroke();
      cur -= 18;
    }
    for (var wi = 0; wi < wings.length; wi++) {
      ctx.save();
      ctx.translate(cur - 6, sy2);
      ctx.scale(0.42, 0.42);
      CRAFT.player(ctx);
      ctx.fillStyle = 'rgba(95,242,200,0.9)';
      ctx.fill();
      ctx.restore();
      cur -= 18;
    }
  }

  var boss = null;
  for (var k = 0; k < enemies.length; k++) {
    var ek = enemies[k];
    if ((ek.kind === 'boss' || ek.kind === 'battleship') && !ek.dead) boss = ek;
  }
  if (boss) {
    var barW = W * 0.6, barX = (W - barW) / 2, barY = 92;
    var col = boss.kind === 'battleship' ? '74,216,255' : '255,62,90';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX - 2, barY - 2, barW + 4, 10);
    ctx.fillStyle = 'rgb(' + col + ')';
    ctx.fillRect(barX, barY, barW * clamp(boss.hp / boss.maxHp, 0, 1), 6);
    ctx.strokeStyle = 'rgba(' + col + ',0.85)';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX - 2, barY - 2, barW + 4, 10);
    // Half-health marker: overdrive kicks in past here.
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(barX + barW * 0.5 - 1, barY - 3, 2, 12);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '700 10px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(200,240,255,0.85)';
    var label = boss.kind === 'battleship' ? 'DREADNOUGHT' : 'WARSHIP';
    if (boss.enraged) label += ' · OVERDRIVE';
    ctx.fillText(label, W / 2, barY + 13);
  }

  ctx.restore();
}

function drawBanner() {
  if (!G.banner || G.state !== 'playing') return;
  var b = G.banner;
  var a = Math.max(0, Math.min(1, b.t / 0.3, (b.life - b.t) / 0.5));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalCompositeOperation = 'lighter';
  drawGlow('0,240,255', W / 2, H * 0.32, 300, 0.2 * a);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = a;
  ctx.font = '900 28px ui-monospace, Menlo, monospace';
  ctx.fillStyle = '#7ef9ff';
  ctx.fillText(b.title, W / 2, H * 0.32);
  ctx.font = '700 14px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(255,90,210,0.95)';
  ctx.fillText(b.sub, W / 2, H * 0.32 + 30);
  ctx.restore();
}

// "New threat" card, slides in under the HUD.
function drawAlert() {
  var al = G.alert;
  if (!al || G.state !== 'playing') return;
  var info = ALERTS[al.kind], rgb = EK[al.kind].glow;
  var a = Math.max(0, Math.min(1, al.t / 0.25, (al.life - al.t) / 0.5));
  var cw = Math.min(W * 0.92, 400), ch = 62, x = (W - cw) / 2;
  var y = 116 - (1 - Math.min(1, al.t / 0.25)) * 30;

  ctx.save();
  ctx.globalAlpha = a;
  rrect(x, y, cw, ch, 12);
  ctx.fillStyle = 'rgba(8,14,28,0.88)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(' + rgb + ',0.85)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // The enemy's own shape as the icon.
  ctx.save();
  ctx.translate(x + 34, y + ch / 2);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(rgb, 0, 0, 60, 0.5 * a);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = a;
  if (al.kind === 'diver' || al.kind === 'sniper') ctx.rotate(Math.PI);
  ctx.scale(1.15, 1.15);
  CRAFT[al.kind](ctx);
  ctx.fillStyle = 'rgba(' + rgb + ',0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgb(' + rgb + ')';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  ctx.globalAlpha = a;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = font(800, 13);
  ctx.fillStyle = 'rgb(' + rgb + ')';
  ctx.fillText('NEW THREAT \u00b7 ' + info[0], x + 66, y + 22);
  ctx.font = font(700, 12);
  ctx.fillStyle = 'rgba(220,245,255,0.92)';
  ctx.fillText(info[1], x + 66, y + 42);
  ctx.restore();
}

// Big WARNING across the screen before a boss arrives.
function drawWarning() {
  var wb = G.warnBoss;
  if (!wb || G.state !== 'playing') return;
  var a = Math.max(0, Math.min(1, wb.t / 0.2, (wb.life - wb.t) / 0.3));
  var blink = CFG.flash ? 1 : (Math.floor(wb.t * 5) % 2 === 0 ? 1 : 0.35);
  var cy = H * 0.42, band = clamp(H * 0.16, 90, 150);

  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(60,0,12,0.55)';
  ctx.fillRect(0, cy - band / 2, W, band);
  hazardStripe(cy - band / 2, 10, wb.t);
  hazardStripe(cy + band / 2 - 10, 10, -wb.t);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = a * blink;
  ctx.font = font(900, clamp(W * 0.11, 34, 72));
  ctx.fillStyle = '#ff3e5a';
  ctx.fillText('WARNING', W / 2, cy - band * 0.1);
  ctx.globalAlpha = a;
  ctx.font = font(800, clamp(W * 0.032, 11, 16));
  ctx.fillStyle = 'rgba(255,210,220,0.95)';
  ctx.fillText((wb.kind === 'boss' ? 'WARSHIP' : 'DREADNOUGHT') + ' APPROACHING', W / 2, cy + band * 0.27);
  ctx.restore();
}

function hazardStripe(y, h, t) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y, W, h);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,62,90,0.85)';
  var off = ((t * 60) % 24 + 24) % 24;
  for (var x = -24 + off; x < W + 24; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x, y + h); ctx.lineTo(x + 10, y); ctx.lineTo(x + 20, y); ctx.lineTo(x + 10, y + h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawMiniShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(5, 4); ctx.lineTo(0, 2); ctx.lineTo(-5, 4);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,240,255,0.8)';
  ctx.fill();
  ctx.restore();
}

function drawButtons() {
  if (G.state === 'playing' && !G.paused) {
    var b = bombBtn;
    ctx.save();
    ctx.globalAlpha = G.bombs > 0 ? 1 : 0.35;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fillStyle = 'rgba(10,20,36,0.55)';
    ctx.fill();
    ctx.strokeStyle = G.bombs > 0 ? 'rgba(255,200,80,0.9)' : 'rgba(120,140,160,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    var bc = G.bombs > 0 ? 'rgba(255,190,70,0.95)' : 'rgba(120,140,160,0.8)';
    ctx.beginPath();
    ctx.arc(b.x, b.y + 3, 9, 0, TAU);
    ctx.fillStyle = bc;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(b.x + 5, b.y - 4);
    ctx.lineTo(b.x + 12, b.y - 12);
    ctx.strokeStyle = G.bombs > 0 ? 'rgba(255,240,180,0.95)' : 'rgba(120,140,160,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.font = '700 12px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText('x' + G.bombs, b.x, b.y + b.r - 6);

    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(255,235,170,0.55)';
    ctx.fillText('B', b.x, b.y - b.r + 10);
    ctx.restore();

    // Roll button
    var r = rollBtn, ready = P.rolls > 0 && P.roll <= 0;
    ctx.save();
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, TAU);
    ctx.fillStyle = 'rgba(10,20,36,0.55)';
    ctx.fill();
    ctx.strokeStyle = ready ? 'rgba(170,240,255,0.9)' : 'rgba(120,140,160,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    var ic = ready ? 'rgba(190,245,255,0.95)' : 'rgba(120,140,160,0.8)';
    ctx.strokeStyle = ic;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y - 2, 8, -Math.PI * 0.1, Math.PI * 1.4);
    ctx.stroke();
    var ax = r.x + Math.cos(-Math.PI * 0.1) * 8, ay = r.y - 2 + Math.sin(-Math.PI * 0.1) * 8;
    ctx.beginPath();
    ctx.moveTo(ax - 4, ay - 4); ctx.lineTo(ax, ay); ctx.lineTo(ax + 4, ay - 3);
    ctx.stroke();

    ctx.font = '700 11px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#cff6ff';
    ctx.fillText('x' + P.rolls, r.x, r.y + r.r - 7);

    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(190,245,255,0.55)';
    ctx.fillText('R', r.x, r.y - r.r + 9);
    ctx.restore();
  }

  // Pause button
  if (G.state === 'playing' && !G.paused) {
    var pb = pauseBtn;
    ctx.save();
    ctx.beginPath();
    ctx.arc(pb.x, pb.y, pb.r, 0, TAU);
    ctx.fillStyle = 'rgba(10,20,36,0.5)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,200,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(150,220,255,0.9)';
    ctx.fillRect(pb.x - 6, pb.y - 7, 4, 14);
    ctx.fillRect(pb.x + 2, pb.y - 7, 4, 14);
    ctx.restore();
  }

  var mb = muteBtn, muted = Sfx.isMuted();
  ctx.save();
  ctx.beginPath();
  ctx.arc(mb.x, mb.y, mb.r, 0, TAU);
  ctx.fillStyle = 'rgba(10,20,36,0.5)';
  ctx.fill();
  ctx.strokeStyle = muted ? 'rgba(255,110,110,0.6)' : 'rgba(120,200,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.strokeStyle = muted ? 'rgba(255,120,120,0.9)' : 'rgba(150,220,255,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mb.x - 7, mb.y - 3);
  ctx.lineTo(mb.x - 3, mb.y - 3);
  ctx.lineTo(mb.x + 2, mb.y - 8);
  ctx.lineTo(mb.x + 2, mb.y + 8);
  ctx.lineTo(mb.x - 3, mb.y + 3);
  ctx.lineTo(mb.x - 7, mb.y + 3);
  ctx.closePath();
  ctx.stroke();

  if (muted) {
    ctx.beginPath();
    ctx.moveTo(mb.x - 8, mb.y + 8); ctx.lineTo(mb.x + 8, mb.y - 8);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(mb.x + 2, mb.y, 6, -0.9, 0.9);
    ctx.stroke();
  }
  ctx.restore();
}

// Title screen. Everything is sized from one unit (u) so it scales up on
// desktop and still fits a phone held either way.
function drawMenu() {
  var nRows = usingTouch ? 4 : 5;
  var totalU = 88.5 + nRows * 4.6;            // content height in units
  var topPad = 46;                               // room for the "All games" button
  var u = clamp(Math.min(W / 66, (H - topPad) / (totalU + 6)), 2.6, 9);
  var cx = W / 2;
  var y = Math.max(topPad, (H - totalU * u) / 2);

  ctx.save();
  // Dim the busy background so the text reads clearly.
  ctx.fillStyle = 'rgba(5,6,15,0.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // ---- Title ----
  y += 7 * u;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow('0,240,255', cx, y + 4 * u, 70 * u, 0.30);
  drawGlow('255,62,200', cx, y + 15 * u, 46 * u, 0.20);
  ctx.globalCompositeOperation = 'source-over';

  ctx.shadowColor = 'rgba(0,255,255,0.85)';
  ctx.shadowBlur = 3 * u;
  ctx.font = font(900, 15 * u);
  ctx.fillStyle = '#0ff';
  ctx.fillText('NEON', cx, y);

  y += 13.5 * u;
  ctx.shadowColor = 'rgba(255,62,200,0.85)';
  ctx.font = font(900, 12.5 * u);
  ctx.fillStyle = '#ff3ec8';
  ctx.fillText('3026', cx, y);
  ctx.shadowBlur = 0;

  // ---- Credit ----
  y += 9 * u;
  ctx.font = font(700, 2.6 * u);
  ctx.fillStyle = 'rgba(215,240,255,0.9)';
  var credit = 'A  GAME  BY  FC';
  ctx.fillText(credit, cx, y);
  var cw = ctx.measureText(credit).width || 30 * u;
  ctx.strokeStyle = 'rgba(126,249,255,0.45)';
  ctx.lineWidth = Math.max(1, 0.2 * u);
  ctx.beginPath();
  ctx.moveTo(cx - cw / 2 - 8 * u, y); ctx.lineTo(cx - cw / 2 - 2 * u, y);
  ctx.moveTo(cx + cw / 2 + 2 * u, y); ctx.lineTo(cx + cw / 2 + 8 * u, y);
  ctx.stroke();

  // ---- Start prompt ----
  y += 8.5 * u;
  var prompt = usingTouch ? 'TAP TO DEPLOY' : 'PRESS ENTER TO DEPLOY';
  ctx.font = font(800, 3.4 * u);
  var pw = (ctx.measureText(prompt).width || 40 * u) + 10 * u, ph = 7 * u;
  uiButton(prompt, cx, y, pw, ph, startGame, { primary: true, pulse: true, size: 3.4 * u });

  // ---- Secondary buttons ----
  y += 7.5 * u;
  var sbw = Math.max(20 * u, pw / 2 - 1 * u), sbh = 4.8 * u;
  uiButton('HIGH SCORES', cx - sbw / 2 - 1 * u, y, sbw, sbh, function () { openOverlay('scores'); }, { size: 2.1 * u });
  uiButton('SETTINGS', cx + sbw / 2 + 1 * u, y, sbw, sbh, function () { openOverlay('settings'); }, { size: 2.1 * u });

  // ---- Controls ----
  y += 7 * u;
  sectionLabel('CONTROLS', cx, y, u);
  y += 5 * u;
  var rows = usingTouch
    ? [[['DRAG'], 'MOVE'], [['BOMB BUTTON'], 'CLEAR BULLETS'], [['ROLL BUTTON'], 'DODGE THROUGH FIRE'],
       [['II'], 'PAUSE']]
    : [[['←↑↓→', 'WASD'], 'MOVE'], [['SPACE', 'B'], 'BOMB'], [['SHIFT', 'R'], 'ROLL'],
       [['P'], 'PAUSE'], [['M'], 'MUTE']];
  for (var i = 0; i < rows.length; i++) {
    var keysR = rows[i][0], xr = cx - 1 * u;
    for (var k = keysR.length - 1; k >= 0; k--) xr = keyCap(keysR[k], xr, y, u) - 1 * u;
    ctx.textAlign = 'left';
    ctx.font = font(700, 2.5 * u);
    ctx.fillStyle = 'rgba(220,245,255,0.92)';
    ctx.fillText(rows[i][1], cx + 1.5 * u, y + 0.1 * u);
    ctx.textAlign = 'center';
    y += 4.6 * u;
  }
  ctx.font = font(700, 2 * u);
  ctx.fillStyle = 'rgba(160,220,255,0.6)';
  ctx.fillText('YOUR SHIP FIRES AUTOMATICALLY', cx, y + 0.4 * u);

  // ---- Power-ups ----
  y += 6 * u;
  sectionLabel('POWER-UPS', cx, y, u);
  y += 6 * u;
  var items = [['W', 'WEAPON'], ['S', 'SHIELD'], ['F', 'WINGMAN'], ['B', 'BOMB'], ['H', 'LIFE']];
  var slot = Math.min(W * 0.9 / items.length, 14 * u);
  for (i = 0; i < items.length; i++) {
    var ix = cx + (i - (items.length - 1) / 2) * slot;
    drawPuIcon(items[i][0], ix, y, 2.2 * u, Math.sin(G.t * 1.5 + i) * 0.25);
    ctx.font = font(700, 1.8 * u);
    ctx.fillStyle = 'rgb(' + PU_RGB[items[i][0]] + ')';
    ctx.fillText(items[i][1], ix, y + 4.4 * u);
  }

  // ---- Best score ----
  y += 10 * u;
  ctx.font = font(700, 2.6 * u);
  ctx.fillStyle = 'rgba(160,220,255,0.7)';
  ctx.fillText('BEST  ' + fmt(G.best), cx, y);

  // ---- Back to the arcade (Games by FC) ----
  uiButton('\u2190 ALL GAMES', 12 + 62, 12 + 17, 124, 34,
    function () { location.href = '../index.html'; }, { size: 11 });

  ctx.restore();
}

function sectionLabel(text, cx, y, u) {
  ctx.font = font(700, 1.9 * u);
  ctx.fillStyle = 'rgba(126,249,255,0.6)';
  ctx.fillText(text, cx, y);
  var w = ctx.measureText(text).width || 12 * u;
  ctx.strokeStyle = 'rgba(126,249,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - w / 2 - 14 * u, y); ctx.lineTo(cx - w / 2 - 2 * u, y);
  ctx.moveTo(cx + w / 2 + 2 * u, y); ctx.lineTo(cx + w / 2 + 14 * u, y);
  ctx.stroke();
}

// Draws a keyboard key ending at xRight; returns its left edge.
function keyCap(label, xRight, cy, u) {
  ctx.font = font(700, 2.2 * u);
  var tw = ctx.measureText(label).width || label.length * 1.4 * u;
  var w = Math.max(3.8 * u, tw + 2.6 * u), h = 3.8 * u, x = xRight - w;
  rrect(x, cy - h / 2, w, h, 0.8 * u);
  ctx.fillStyle = 'rgba(14,30,52,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(126,249,255,0.6)';
  ctx.lineWidth = Math.max(1, 0.25 * u);
  ctx.stroke();
  ctx.fillStyle = '#dffcff';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, cy + 0.15 * u);
  return x;
}

// Button sizes shared by the menu screens.
function menuMetrics(count) {
  var bh = clamp(H * 0.065, 38, 56);
  var gap = clamp(H * 0.018, 8, 16);
  var bw = Math.min(W * 0.78, 320);
  return { bh: bh, gap: gap, bw: bw, total: count * bh + (count - 1) * gap };
}

function drawPauseMenu() {
  ctx.save();
  ctx.fillStyle = 'rgba(5,6,15,0.7)';
  ctx.fillRect(0, 0, W, H);

  var m = menuMetrics(4);
  var top = Math.max(H * 0.36, (H - m.total) / 2 + 30);
  screenTitle('PAUSED', top - clamp(H * 0.12, 60, 110), clamp(W * 0.09, 28, 44));

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = font(700, 12);
  ctx.fillStyle = 'rgba(160,220,255,0.7)';
  ctx.fillText('SECTOR ' + G.sector + ' · WAVE ' + G.wave + ' · SCORE ' + fmt(G.score),
    W / 2, top - clamp(H * 0.12, 60, 110) + 34);

  var y = top + m.bh / 2;
  uiButton('RESUME', W / 2, y, m.bw, m.bh, function () { setPaused(false); }, { primary: true });
  y += m.bh + m.gap;
  uiButton('RESTART', W / 2, y, m.bw, m.bh, startGame);
  y += m.bh + m.gap;
  uiButton('SETTINGS', W / 2, y, m.bw, m.bh, function () { openOverlay('settings'); });
  y += m.bh + m.gap;
  uiButton('QUIT TO TITLE', W / 2, y, m.bw, m.bh, quitToTitle);

  ctx.font = font(700, 11);
  ctx.fillStyle = 'rgba(160,220,255,0.45)';
  ctx.fillText(usingTouch ? '' : 'ESC OR P TO RESUME', W / 2, y + m.bh / 2 + 24);
  ctx.restore();
}

function setCfg(k, v) {
  CFG[k] = v;
  saveCfg();
  Sfx.setVolumes();
  if (k === 'lefty' || k === 'arcade') onResize();
  Sfx.tick();
}

function drawSettings() {
  ctx.save();
  ctx.fillStyle = 'rgba(5,6,15,0.88)';
  ctx.fillRect(0, 0, W, H);

  var rows = [
    ['MUSIC', 'slider', 'music'],
    ['SOUND FX', 'slider', 'sfx'],
    ['SCREEN SHAKE', 'toggle', 'shake'],
    ['REDUCED FLASHING', 'toggle', 'flash'],
    ['VIBRATION', 'toggle', 'vibrate'],
    ['LEFT-HANDED', 'toggle', 'lefty'],
    ['ARCADE FRAME', 'toggle', 'arcade']
  ];
  var rh = clamp((H - 130) / (rows.length + 1.6), 32, 56);
  var pw = Math.min(W * 0.92, 520), x0 = (W - pw) / 2;
  var y = Math.max(16, (H - (rows.length + 1.4) * rh - 56) / 2);

  screenTitle('SETTINGS', y + 18, clamp(rh * 0.6, 20, 30));
  y += 50;

  for (var i = 0; i < rows.length; i++) {
    settingsRow(rows[i], x0, y + 3, pw, rh - 6);
    y += rh;
  }
  ctx.font = font(700, 10);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(160,220,255,0.45)';
  ctx.fillText('ARCADE FRAME: PLAY IN A TALL COLUMN ON WIDE SCREENS', W / 2, y + 6);
  uiButton('BACK', W / 2, y + rh * 0.4 + 30, Math.min(pw, 240), rh - 8, uiBack, { primary: true });
  ctx.restore();
}

function settingsRow(def, x, y, w, h) {
  var key = def[2], slider = def[1] === 'slider';
  var minusX = x + w * 0.52, plusX = x + w - h * 0.6;
  var left, right, act;
  if (slider) {
    left = function () { setCfg(key, clamp(CFG[key] - 1, 0, 10)); };
    right = function () { setCfg(key, clamp(CFG[key] + 1, 0, 10)); };
    act = function (px) {
      if (px === undefined) setCfg(key, (CFG[key] + 1) % 11);
      else if (px < (minusX + plusX) / 2) left();
      else right();
    };
  } else {
    act = function () { setCfg(key, !CFG[key]); };
    left = right = act;
  }
  var foc = uiItem(x, y, w, h, act, left, right);

  rrect(x, y, w, h, Math.min(10, h / 3));
  ctx.fillStyle = foc ? 'rgba(30,60,90,0.95)' : 'rgba(10,22,40,0.85)';
  ctx.fill();
  ctx.strokeStyle = foc ? '#d8feff' : 'rgba(126,249,255,0.3)';
  ctx.lineWidth = foc ? 2 : 1;
  ctx.stroke();

  var fs = clamp(h * 0.36, 11, 16);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = font(700, fs);
  ctx.fillStyle = 'rgba(220,245,255,0.95)';
  ctx.fillText(def[0], x + 14, y + h / 2 + 1);

  ctx.textAlign = 'center';
  if (slider) {
    var v = CFG[key];
    ctx.font = font(800, fs * 1.3);
    ctx.fillStyle = '#7ef9ff';
    ctx.fillText('−', minusX, y + h / 2);
    ctx.fillText('+', plusX, y + h / 2);
    var bx0 = minusX + fs, bx1 = plusX - fs, segW = (bx1 - bx0) / 10;
    for (var s = 0; s < 10; s++) {
      ctx.fillStyle = s < v ? 'rgba(126,249,255,0.9)' : 'rgba(126,249,255,0.15)';
      ctx.fillRect(bx0 + s * segW + 1, y + h * 0.32, Math.max(1, segW - 2), h * 0.36);
    }
  } else {
    var on = CFG[key];
    var pw2 = clamp(h * 1.5, 46, 70), ph = h * 0.62, px = x + w - pw2 / 2 - 10;
    rrect(px - pw2 / 2, y + (h - ph) / 2, pw2, ph, ph / 2);
    ctx.fillStyle = on ? 'rgba(0,240,255,0.25)' : 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = on ? '#7ef9ff' : 'rgba(160,190,210,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.font = font(800, fs * 0.9);
    ctx.fillStyle = on ? '#eaffff' : 'rgba(160,190,210,0.7)';
    ctx.fillText(on ? 'ON' : 'OFF', px, y + h / 2 + 1);
  }
}

function drawScores() {
  ctx.save();
  ctx.fillStyle = 'rgba(5,6,15,0.9)';
  ctx.fillRect(0, 0, W, H);

  var rh = clamp((H - 170) / 11, 20, 40);
  var pw = Math.min(W * 0.9, 460), x0 = (W - pw) / 2;
  var y = Math.max(16, (H - (11 * rh + 120)) / 2);

  screenTitle('HIGH SCORES', y + 18, clamp(W * 0.07, 22, 32), '255,62,200');
  y += 52;

  var fs = clamp(rh * 0.5, 11, 18);
  var cRank = x0 + pw * 0.08, cName = x0 + pw * 0.26, cScore = x0 + pw * 0.72, cWave = x0 + pw * 0.92;
  ctx.textBaseline = 'middle';
  ctx.font = font(700, fs * 0.7);
  ctx.fillStyle = 'rgba(126,249,255,0.55)';
  ctx.textAlign = 'center'; ctx.fillText('#', cRank, y);
  ctx.textAlign = 'left'; ctx.fillText('NAME', cName, y);
  ctx.textAlign = 'right'; ctx.fillText('SCORE', cScore, y);
  ctx.fillText('WAVE', cWave, y);
  y += rh * 0.8;

  for (var i = 0; i < 10; i++) {
    var r = scores[i], mine = G.lastRank === i + 1, ry = y + i * rh;
    if (mine) {
      rrect(x0, ry - rh * 0.45, pw, rh * 0.9, 6);
      ctx.fillStyle = 'rgba(255,215,90,0.14)';
      ctx.fill();
    }
    ctx.font = font(i < 3 ? 800 : 700, fs);
    ctx.fillStyle = mine ? '#ffd76a' : (r ? (i < 3 ? '#eaffff' : 'rgba(200,235,255,0.85)') : 'rgba(160,200,230,0.3)');
    ctx.textAlign = 'center'; ctx.fillText(String(i + 1), cRank, ry);
    ctx.textAlign = 'left'; ctx.fillText(r ? r.n : '---', cName, ry);
    ctx.textAlign = 'right'; ctx.fillText(r ? fmt(r.s) : '-', cScore, ry);
    ctx.fillText(r && r.w ? String(r.w) : '-', cWave, ry);
  }

  uiButton('BACK', W / 2, y + 10 * rh + 12, Math.min(pw, 240), clamp(rh * 1.2, 36, 50), uiBack, { primary: true });
  ctx.restore();
}

function drawEntry() {
  var en = G.entry;
  if (!en) return;
  ctx.save();
  ctx.fillStyle = 'rgba(5,6,15,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  var bw = clamp(Math.min(W * 0.16, H * 0.11), 48, 88), bh = bw * 1.2, gap = bw * 0.22;
  var by = clamp(H * 0.48, bh / 2 + 150, H - bh / 2 - 120);

  screenTitle('NEW HIGH SCORE', by - bh / 2 - 118, clamp(W * 0.07, 22, 34), '255,215,90');
  ctx.font = font(800, 16);
  ctx.fillStyle = '#eaffff';
  ctx.fillText('RANK #' + en.rank + '  ·  ' + fmt(G.score), W / 2, by - bh / 2 - 80);
  ctx.font = font(700, 12);
  ctx.fillStyle = 'rgba(160,220,255,0.7)';
  ctx.fillText('ENTER YOUR INITIALS', W / 2, by - bh / 2 - 52);

  var x0 = W / 2 - (3 * bw + 2 * gap) / 2;
  for (var i = 0; i < 3; i++) {
    var x = x0 + i * (bw + gap), cur = en.slot === i;
    (function (idx, bx) {
      // Up / down arrows, and tapping the box selects it.
      uiHot(bx, by - bh / 2 - 40, bw, 38, function () { cycleLetter(idx, 1); });
      uiHot(bx, by + bh / 2 + 2, bw, 38, function () { cycleLetter(idx, -1); });
      uiHot(bx, by - bh / 2, bw, bh, function () { en.slot = idx; Sfx.tick(); });
    })(i, x);

    ctx.fillStyle = 'rgba(126,249,255,0.75)';
    triangle(x + bw / 2, by - bh / 2 - 21, 10, -1);
    triangle(x + bw / 2, by + bh / 2 + 21, 10, 1);

    rrect(x, by - bh / 2, bw, bh, 10);
    ctx.fillStyle = cur ? 'rgba(0,240,255,0.16)' : 'rgba(10,22,40,0.9)';
    ctx.fill();
    ctx.strokeStyle = cur ? '#d8feff' : 'rgba(126,249,255,0.45)';
    ctx.lineWidth = cur ? 2.5 : 1.5;
    ctx.stroke();
    ctx.font = font(900, bw * 0.66);
    ctx.fillStyle = cur ? '#ffffff' : '#7ef9ff';
    ctx.fillText(en.letters[i], x + bw / 2, by + 2);
    if (cur && Math.floor(G.t * 3) % 2 === 0) {
      ctx.fillStyle = '#7ef9ff';
      ctx.fillRect(x + bw * 0.25, by + bh / 2 - 9, bw * 0.5, 3);
    }
  }

  uiButton('SAVE', W / 2, by + bh / 2 + 82, Math.min(W * 0.6, 240), 48, finishEntry, { primary: true, pulse: true });
  ctx.font = font(700, 11);
  ctx.fillStyle = 'rgba(160,220,255,0.5)';
  ctx.fillText(usingTouch ? 'TAP ▲ ▼ TO CHANGE LETTERS' : 'TYPE LETTERS OR USE ARROWS · ENTER TO SAVE',
    W / 2, by + bh / 2 + 124);
  ctx.restore();
}

function triangle(cx, cy, s, dir) {
  ctx.beginPath();
  ctx.moveTo(cx - s, cy - dir * s * 0.5);
  ctx.lineTo(cx + s, cy - dir * s * 0.5);
  ctx.lineTo(cx, cy + dir * s * 0.6);
  ctx.closePath();
  ctx.fill();
}

function drawContinue() {
  ctx.save();
  ctx.fillStyle = 'rgba(5,6,15,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.globalCompositeOperation = 'lighter';
  drawGlow('0,240,255', W / 2, H * 0.4, 280, 0.28);
  ctx.globalCompositeOperation = 'source-over';

  ctx.font = '900 30px ui-monospace, Menlo, monospace';
  ctx.fillStyle = '#7ef9ff';
  ctx.fillText('CONTINUE?', W / 2, H * 0.36);

  ctx.font = '700 16px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(160,220,255,0.85)';
  ctx.fillText('SCORE ' + fmt(G.score), W / 2, H * 0.44);

  var bw = Math.min(240, W * 0.6), bx = (W - bw) / 2, by = H * 0.5;
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(bx, by, bw, 8);
  var k = clamp(G.contT / CONTINUE_TIME, 0, 1);
  ctx.fillStyle = G.contT < 3.5 ? '#ff3e5a' : '#0ff';
  ctx.fillRect(bx, by, bw * k, 8);

  ctx.font = '900 28px ui-monospace, Menlo, monospace';
  ctx.fillStyle = G.contT < 3.5 ? '#ff3e5a' : '#7ef9ff';
  ctx.fillText(Math.ceil(G.contT), W / 2, H * 0.5 + 42);

  ctx.font = '700 13px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(160,220,255,0.8)';
  ctx.fillText('TAP OR ENTER TO CONTINUE', W / 2, H * 0.62 + Math.sin(G.t * 4) * 3);

  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(5,6,15,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  var m = menuMetrics(3);
  var textH = 200;
  var y = Math.max(20, (H - (textH + m.total + 20)) / 2) + 22;

  screenTitle('SIGNAL LOST', y, clamp(W * 0.085, 26, 40), '255,62,90');
  y += 52;
  ctx.font = font(800, 22);
  ctx.fillStyle = '#7ef9ff';
  ctx.fillText('SCORE ' + fmt(G.score), W / 2, y);
  y += 28;
  if (G.lastRank) {
    ctx.font = font(800, 14);
    ctx.fillStyle = '#ffd76a';
    ctx.fillText('NEW HIGH SCORE · RANK #' + G.lastRank, W / 2, y);
  } else {
    ctx.font = font(700, 14);
    ctx.fillStyle = 'rgba(160,220,255,0.7)';
    ctx.fillText('BEST ' + fmt(Math.max(G.best, scores.length ? scores[0].s : 0)), W / 2, y);
  }
  y += 28;
  ctx.font = font(700, 12);
  ctx.fillStyle = 'rgba(160,220,255,0.6)';
  ctx.fillText('SECTOR ' + G.sector + ' · WAVE ' + G.wave, W / 2, y);
  ctx.fillText('MAX COMBO ' + G.maxCombo + '   GRAZES ' + G.graze, W / 2, y + 18);
  if (G.continues > 0) ctx.fillText('CONTINUES ' + G.continues, W / 2, y + 36);
  y += textH - 128;

  if (G.overT > 0.8) {
    y += m.bh / 2;
    uiButton('REDEPLOY', W / 2, y, m.bw, m.bh, startGame, { primary: true, pulse: true });
    y += m.bh + m.gap;
    uiButton('HIGH SCORES', W / 2, y, m.bw, m.bh, function () { openOverlay('scores'); });
    y += m.bh + m.gap;
    uiButton('TITLE', W / 2, y, m.bw, m.bh, quitToTitle);
  }

  ctx.font = '700 11px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(160,220,255,0.4)';
  ctx.fillText('A GAME BY FC', W / 2, H - 26);

  ctx.restore();
}

// ---------- Loop ----------
var last = performance.now();
function loop(now) {
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Auto-pause when the tab is hidden so you don't come back to a dead ship.
document.addEventListener('visibilitychange', function () {
  if (document.hidden) setPaused(true);
  else last = performance.now();
});

})();
</script>
<script>
/* Games by FC: lets the whole arcade work offline after the first visit */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',function(){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){});});
}
</script>
