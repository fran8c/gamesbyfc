<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Just a Moment!</title>
<style>
:root{--ink:#2b2238;--cream:#fff7e6;--sun:#ffd23f;--pink:#ff5d8f;--teal:#2ec4b6;--sky:#7ad3ff;--panel:#fffaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#bfefff 0%,#71c8f2 60%,#4aa3d6 100%);font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#chart{display:block;width:100%;height:auto}
.btn{font:inherit;font-weight:700;font-size:15px;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#ffe36e,#ffc21a);color:var(--ink);padding:6px 14px;min-height:42px;min-width:42px;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.75);cursor:pointer;transition:transform .06s ease}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#e3ddd2;color:#9c948c;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:13px;min-height:36px;border-radius:12px}
.btn.go{background:linear-gradient(#8ef07a,#3fc33a)}.btn.red{background:linear-gradient(#ff8aa8,#ff4f7c);color:#fff}.btn.white{background:linear-gradient(#fff,#efe9dc)}.btn.off{background:linear-gradient(#e7e2d8,#cfc8bb);color:#7d756d}
.btn.on{background:linear-gradient(#bfe9ff,#7ad3ff)}
/* top bar */
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:6px 8px;pointer-events:none;flex-wrap:wrap;z-index:4}
#hud .btn{pointer-events:auto}
.pill{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.8);display:flex;align-items:center;gap:6px}
.pill small{font-weight:400;font-size:12px;opacity:.8}
.pill.cash{background:#dfffd3}.pill.goal{background:#fff1b8}
.pill .bar{width:54px;height:8px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;display:inline-block}
.pill .bar i{display:block;height:100%;background:#3fc33a}
.spacer{flex:1}
/* bottom toolbar */
#toolbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:flex-end;padding:6px 8px 8px;z-index:4;pointer-events:none}
#toolbar>*{pointer-events:auto}
.tool{font:inherit;font-weight:700;font-size:12px;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#fff,#efe9dc);color:var(--ink);width:66px;height:62px;padding:2px;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 #fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.tool b{font-size:24px;line-height:1}
.tool.active{background:linear-gradient(#ffe36e,#ffc21a)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tool[disabled]{opacity:.45;cursor:not-allowed}
.tool .badge{position:absolute;top:-7px;right:-7px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:11px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#tip{background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:5px 11px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.8);max-width:520px;min-height:36px;display:flex;align-items:center;gap:8px;margin:0 6px 6px;flex:1 1 200px}
#tip .pa{background:var(--pink);color:#fff;border-radius:8px;padding:1px 6px;font-size:11px;border:2px solid var(--ink);flex:none}
#bOpen{height:62px;font-size:17px;padding:0 18px;border-radius:16px}
/* side panel */
#sheet{position:absolute;right:8px;top:52px;bottom:84px;width:min(330px,44vw);background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 12px;display:none;overflow:auto;z-index:5}
#sheet h3{margin:0 36px 2px 0;font-size:19px;display:flex;align-items:center;gap:8px}
#sheet h4{margin:10px 0 4px;font-size:14px;border-bottom:2px dashed #d9cdb8;padding-bottom:2px}
#sheet .x{position:absolute;top:6px;right:6px;min-width:34px;min-height:34px;padding:0;border-radius:10px}
#sheet .sub{font-size:13px;margin:0 0 6px;line-height:1.4}
#sheet .grid{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0}
#sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
#sheet .opt{text-align:left;font-size:14px;line-height:1.2;display:flex;gap:8px;align-items:center}
#sheet .opt .ic{font-size:22px;flex:none}
#sheet .opt span{flex:1}
#sheet .opt small{display:block;font-weight:400;font-size:12px}
#sheet .bar{height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;margin:3px 0 7px}
#sheet .bar i{display:block;height:100%}
#sheet .row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px dotted #e1d6c2}
#sheet .row b{font-weight:700}
#sheet .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px}
#sheet .chip{font-size:12px;padding:2px 8px;border:2px solid var(--ink);border-radius:999px;background:#fff}
#sheet .log p{margin:0 0 6px;font-size:13px;line-height:1.35;border-left:4px solid #d9cdb8;padding-left:6px}
#sheet .log p i{font-style:normal;opacity:.6;font-size:11px;display:block}
.ok{color:#2c9a2a}.bad{color:#d6334f}
/* build helper bar */
#buildbar{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:6px 10px;display:none;gap:8px;align-items:center;z-index:6;font-weight:700;font-size:13px;max-width:calc(100% - 20px)}
#buildbar .btn{min-height:34px}
/* advisor */
#advisor{position:absolute;left:8px;bottom:84px;width:min(380px,calc(100% - 16px));background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 10px;display:none;gap:10px;z-index:7;align-items:flex-start}
#advisor .face{width:64px;height:64px;flex:none;border:3px solid var(--ink);border-radius:50%;background:#ffe9b0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
#advisor .face img{width:100%;height:100%;object-fit:cover}
#advisor .txt{font-size:14px;line-height:1.35;flex:1}
#advisor .txt b{display:block;font-size:12px;color:var(--pink)}
#advisor .acts{display:flex;gap:6px;margin-top:6px}
/* reviews */
#reviews{position:absolute;top:50px;left:8px;width:min(320px,44vw);z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:5px}
.rev{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:4px 9px;font-size:12px;line-height:1.3;box-shadow:0 3px 0 var(--ink);animation:revIn .3s ease}
.rev .st{color:#ffb000;letter-spacing:1px}.rev .st i{color:#d8d0c4;font-style:normal}
@keyframes revIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
/* overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,34,56,.45);z-index:10}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:16px 22px;width:min(480px,calc(100% - 30px));text-align:center;max-height:calc(100% - 20px);overflow:auto}
.card h1{margin:0;font-size:40px;color:var(--pink);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
.card h2{margin:0 0 4px;font-size:24px}
.card p{margin:6px 0;font-size:14px}
.card input{font:inherit;font-size:17px;font-weight:700;width:100%;padding:9px 12px;border:3px solid var(--ink);border-radius:12px;margin:8px 0 12px;background:#fff;color:var(--ink)}
.credit{font-size:12px;opacity:.7;margin-top:12px}
.levels{display:grid;gap:8px;margin:10px 0;text-align:left}
.levels .btn{text-align:left}
.levels small{display:block;font-weight:400;font-size:12px}
.stars{font-size:30px;letter-spacing:4px;color:#ffc21a;text-shadow:2px 2px 0 var(--ink);margin:2px 0}
.stars .dim{color:#d8d0c4}
#ticker{position:absolute;left:0;right:0;height:30px;background:#2b1d3a;color:#fff;z-index:4;align-items:center;gap:8px;padding:0 8px;border-bottom:3px solid var(--ink);pointer-events:none;overflow:hidden}
#ticker .tpa{background:var(--pink);border:2px solid #fff;border-radius:8px;padding:0 6px;font-weight:800;font-size:12px;flex:none}
#ticker .tview{overflow:hidden;flex:1;white-space:nowrap}
#ticker .tmsg{display:inline-block;padding-left:100%;font-weight:700;font-size:15px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#rightCol{position:absolute;right:8px;width:min(250px,40vw);z-index:4;display:flex;flex-direction:column;gap:6px;align-items:stretch}
#goalCard{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer}
#goalCard .gh{font-size:13px;display:flex;justify-content:space-between}
#goalCard .gs{margin-top:4px;color:#7a5cff;font-size:11px;text-transform:uppercase}
#goalCard .gr{display:flex;justify-content:space-between;gap:6px}
#goalCard .gr.ok{color:#2e9a2a}#goalCard .gr.mini{color:#555;font-size:11px}
#goalCard .gb{height:5px;background:#e6dcc8;border-radius:3px;margin:1px 0 3px;overflow:hidden}#goalCard .gb i{display:block;height:100%;background:#3fc33a}
#alertBtn{align-self:flex-end;background:#ff4f4f;color:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:4px 12px;font-weight:800;font-size:15px;align-items:center;gap:5px;cursor:pointer;animation:pulse 1.2s infinite}
#alertBtn small{font-size:11px;font-weight:700}
@keyframes pulse{50%{transform:scale(1.07)}}
.paper{background:#fbf7ec;max-width:520px;font-family:Georgia,serif;text-align:left}
.paper .mast{font-size:28px;font-weight:900;text-align:center;border-bottom:4px double #222;padding-bottom:4px;font-family:Georgia,serif}
.paper .pdate{text-align:center;font-size:12px;border-bottom:1px solid #222;padding:3px 0;margin-bottom:8px;font-style:italic}
.paper .phl{font-size:24px;font-weight:900;line-height:1.15;margin:6px 0 10px}
.paper .pcols{columns:2;column-gap:16px;font-size:13px}.paper .pcols p{margin:0 0 8px;break-inside:avoid}
.paper .pad{border:2px dashed #222;padding:6px;font-size:12px;margin:8px 0;text-align:center}
@media (max-width:700px){.paper .pcols{columns:1}.paper .phl{font-size:19px}#rightCol{width:min(200px,46vw)}}
.quip{font-style:italic;color:#7a5cff;font-size:13px;margin:4px 0 8px}
.memo{background:#fff;border:3px dashed var(--ink);border-radius:10px;padding:8px 10px;text-align:left;font-size:13px;margin:10px 0}
.memo b{display:block;font-size:12px;opacity:.75}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;text-align:left;font-size:14px;margin:8px auto;max-width:320px}
.stats span:nth-child(even){text-align:right;font-weight:700}
.news{background:#f3efe6;border:3px solid var(--ink);border-radius:6px;padding:6px 10px;margin:6px 0 8px;font-family:Georgia,'Times New Roman',serif;text-align:left}
.news b{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid var(--ink);margin-bottom:4px;padding-bottom:2px;text-align:center}
.news .hl{font-size:18px;font-weight:700;line-height:1.2}
.news .side{font-size:12px;margin-top:4px;border-top:1px solid #b9b0a0;padding-top:3px;font-style:italic}
.targets{text-align:left;font-size:14px;margin:8px 0}
.targets div{display:flex;justify-content:space-between;border-bottom:1px dotted #cdbfa6;padding:2px 0}
.dgrid{display:grid;gap:8px;margin-top:10px}.dgrid .opt{text-align:left}.dgrid small{display:block;font-weight:400;font-size:12px}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:7px 13px;font-weight:700;font-size:13px;display:none;z-index:8;max-width:90%;text-align:center;pointer-events:none}
#toast.go{pointer-events:auto;cursor:pointer;background:#5a3fd6}
#toast.go:after{content:" 📍 Show me";opacity:.85}
.log p[data-at]{cursor:pointer}.log p[data-at]:hover{background:#fff3c4}
body.big .pill{font-size:16px}body.big #sheet .sub,body.big #sheet .opt,body.big .row{font-size:15px}body.big #tip{font-size:15px}body.big .tool{font-size:13px}body.big #advisor .txt{font-size:16px}
@media (pointer:coarse){.tool{width:62px;height:62px}.btn{min-height:46px}#sheet .btn.sm{min-height:42px;font-size:14px}}
@media (max-height:520px){.tool{width:46px;height:46px;font-size:9px;border-radius:11px}.tool b{font-size:17px}#bOpen{height:46px;font-size:13px;padding:0 10px}#tip{display:none}#advisor{width:min(330px,calc(100% - 16px));padding:5px 8px;bottom:60px}#advisor .face{width:42px;height:42px;font-size:24px}#advisor .txt{font-size:12px}.pill{font-size:12px;padding:1px 7px}#hud .btn.sm{min-height:30px;min-width:34px;padding:1px 7px}#sheet,#buildbar{bottom:60px}#reviews{display:none}}
@media (max-width:1180px){.pill small{display:none}#bMusic,#bSfx{display:none}.tool{width:56px;font-size:11px}.tool b{font-size:21px}}
#tooltip{position:absolute;pointer-events:none;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:4px 8px;font-size:12px;line-height:1.3;z-index:6;display:none;max-width:240px;box-shadow:0 3px 0 var(--ink)}
#tooltip b{font-size:13px}
#paused{position:absolute;inset:0;z-index:3;pointer-events:none;display:none;align-items:center;justify-content:center;background:rgba(43,34,56,.18)}
#paused span{font-size:42px;font-weight:700;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink);letter-spacing:4px}
#rotate{display:none;position:absolute;inset:0;z-index:50;background:var(--sky);align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:22px;padding:30px}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
@media (max-width:900px){.tool{width:54px;height:54px;font-size:10px}.tool b{font-size:20px}#bOpen{height:54px;font-size:15px}#sheet{bottom:72px}#buildbar,#advisor{bottom:72px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="paused"><span>PAUSED</span></div>

<div id="hud" style="display:none">
  <span class="pill" id="hName"></span>
  <span class="pill" id="hDay"></span>
  <span class="pill cash" id="hCash"></span>
  <span class="pill" id="hRate"></span>
  <span class="pill" id="hToday"></span>
  <span class="pill goal" id="hGoal" style="display:none"></span>
  <span class="pill" id="hEmerg" style="display:none;background:#ffd0d6"></span>
  <span class="spacer"></span>
  <button class="btn sm white" id="bMusic" title="Music">🎵</button>
  <button class="btn sm white" id="bSfx" title="Sound effects">🔊</button>
  <button class="btn sm white" id="bPause" aria-label="Pause">II</button>
  <button class="btn sm" id="b1x">1×</button>
  <button class="btn sm white" id="b2x">2×</button>
  <button class="btn sm white" id="b3x">3×</button>
  <button class="btn sm white" id="bMenu">Menu</button>
</div>

<div id="toolbar" style="display:none">
  <button class="tool" id="tBuild"><b>🏗️</b>Build</button>
  <button class="tool" id="tFurn"><b>🪑</b>Items</button>
  <button class="tool" id="tHire"><b>🙋</b>Hire</button>
  <button class="tool" id="tStaff"><b>📋</b>Staff</button>
  <button class="tool" id="tRooms"><b>🏥</b>Rooms</button>
  <button class="tool" id="tMoney"><b>💰</b>Money</button>
  <button class="tool" id="tResearch"><b>🔬</b>Research</button>
  <button class="tool" id="tLog"><b>📨</b>News<span class="badge" id="logBadge" style="display:none">0</span></button>
  <button class="tool" id="tLabels"><b>🏷️</b>Labels</button>
  <button class="tool" id="tWalls"><b>🧱</b>Walls</button>
  <button class="tool" id="tUndo" title="Undo (Ctrl+Z)"><b>↶</b>Undo</button>
  <button class="tool" id="tSandbox" style="display:none"><b>🧪</b>Sandbox</button>
  <div id="tip"></div>
  <button class="tool" id="tKopi" style="display:none"><b>☕</b>Kopi</button>
  <button class="btn go" id="bOpen">Open Doors</button>
</div>

<div id="ticker" style="display:none"></div>
<div id="rightCol"><div id="goalCard"></div><button id="alertBtn" style="display:none"></button></div>
<div id="buildbar"></div>
<div id="sheet"></div>
<div id="advisor"></div>
<div id="toast"></div>
<div id="tooltip"></div>
<div id="reviews"></div>

<div class="overlay" id="title">
  <div class="card">
    <h1>Just a Moment!</h1>
    <p>Build a hospital in Nusawangi City. Cure the patients. Survive the paperwork.</p>
    <input id="nameIn" maxlength="24" placeholder="Seri Sejahtera General" aria-label="Hospital name">
    <div class="levels" id="levelList"></div>
    <button class="btn go" id="bCont" style="display:none"></button>
    <button class="btn white" id="bSandbox">🧪 Sandbox: try everything, no targets</button>
    <div class="credit">A Game by FC · turn your sound on · mouse wheel to zoom, drag to scroll</div>
  </div>
</div>
<div class="overlay" id="paper" style="display:none;z-index:8"><div class="card paper" id="paperCard"></div></div>
<div class="overlay" id="report" style="display:none"><div class="card" id="reportCard"></div></div>
<div class="overlay" id="dilemma" style="display:none;z-index:9"><div class="card" id="dilemmaCard"></div></div>
<div id="rotate">Please rotate your phone to landscape.</div>

<script>
'use strict';

const SATIRE = {"pa": {"day_open": ["Good morning. {hospital} is open. The queue is already forming. Enjoy.", "Welcome to {hospital}. Please take a ticket and lower your expectations.", "Today's target is {target} cures. It was set by a committee that has never met.", "The coffee machine is working. This is not a drill. Repeat: not a drill.", "Please have your forms ready. If you have no forms, please form a queue.", "The photocopier has been reviewed by management. It remains unimpressed."], "copier_jam": ["The photocopier on {station} is jammed. Management calls this a workflow pause.", "Copier jam at {station}. Please form an orderly queue for the queue.", "The copier is thinking. It may think for some time. Please remain calm.", "A paper jam has been detected. The paper denies involvement.", "Copier {station} is down. The downtime has been added to your KPIs.", "Copier jam at {station}. A repair request has been filed. Please fix it anyway."], "copier_jam_again": ["The copier is jammed again. This is now a recurring feature, not a bug.", "Second jam today at {station}. The copier is exceeding its targets.", "Copier jam again. Management thanks you for your patience and your forms.", "The copier has jammed twice. It is now eligible for a performance bonus.", "Another jam at {station}. Please update your personal coping strategy.", "The copier requests a moment. The moment has been escalated to a committee."], "dispenser_empty": ["The ticket dispenser at {station} is empty. Please take a number from the air.", "Ticket dispenser empty. The queue is now self-organizing. Good luck.", "No tickets at {station}. Please remember your place in the queue by heart.", "The dispenser is empty. Management is printing a memo about the paper shortage.", "Ticket roll finished at {station}. This is the new paperless experience.", "Dispenser empty. Please form a queue to discuss the queue."], "stamps_out": ["The stamp desk is out of stamps. Please continue filling forms for future stamping.", "Stamps are temporarily unavailable. Temporarily means we will not check again.", "No stamps at {station}. Please admire your completed forms in the meantime.", "Stamp stock is zero. The zero has been entered into a spreadsheet.", "Stamps are out. Management is stamping a memo to approve more stamps.", "No stamps. Please keep your forms warm and your expectations low."], "stamps_arrived": ["Stamps have arrived at {station}. Please queue in the order you were already queueing.", "The stamps are back. The forms are ready. The queue is eternal.", "Stamp delivery complete. Management has scheduled a celebration meeting.", "Stamps available at {station}. Please stamp responsibly and in triplicate.", "The stamp order has arrived. It was approved by three committees and a plant.", "Stamps restored. Normal bureaucratic service has resumed."], "queue_full": ["The queue is full. Please wait for the queue to become less full. Thank you.", "Queue capacity reached. Please stand in the overflow queue by the other queue.", "The waiting area is at capacity. Management calls this a vibrant community.", "Queue full. Please take a moment to appreciate the efficiency of the queue system.", "All seats are taken. Standing patients may lose patience at the normal rate.", "The queue is full. Please do not feed the queue."], "staff_break": ["Staff break in progress. The queue will be cared for by hope and signage.", "A staff member is on break. This is scheduled. This is also surprising.", "Break time. Please direct urgent questions to the nearest laminated notice.", "Staff break. The System reminds you that breaks are a productivity tool.", "A colleague is recharging. Please recharge your patience in the waiting area.", "Staff break. The queue has been informed and is taking it well."], "staff_nap": ["A staff member is resting their eyes. This is not a nap. It is alert recovery.", "Quiet, please. A colleague is performing a short horizontal strategy session.", "Staff nap in pro   let t = (S.rng += 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);

}

  G = {room:new Int32Array(W * H), obj:new Int32Array(W * H), wh:new Uint8Array(W * (H + 1)), wv:new Uint8Array((W + 1) * H)};
  for (const r of S.rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) G.room[y * W + x] = r.id;
  for (const o of S.objs) for (const t of objTiles(o)) if (inMap(t.x, t.y)) G.obj[t.y * W + t.x] = o.id;
  for (let x = 0; x < S.bw; x++){ G.wh[0 * W + x] = 1; G.wh[S.bh * W + x] = x === S.ent ? 2 : 1; }
  for (let y = 0; y < S.bh; y++){ G.wv[y * (W + 1) + 0] = 1; G.wv[y * (W + 1) + S.bw] = 1; }
  for (const r of S.rooms){
    for (let x = r.x; x < r.x + r.w; x++){ G.wh[r.y * W + x] = 1; G.wh[(r.y + r.h) * W + x] = 1; }
    for (let y = r.y; y < r.y + r.h; y++){ G.wv[y * (W + 1) + r.x] = 1; G.wv[y * (W + 1) + r.x + r.w] = 1; }

// The picture is scaled to its real height (characters are 56 px tall), never bigger than its floor space,
// then pushed against the wall behind it (the side opposite the way it faces). Returns the rectangle it covers.
function objRect(o, key){
  const def = OBJ[o.key], f = foot(def, o.o), m = SPR_META[(key || def.spr).replace('prop:', '')];

  const flip = objMirrorRaw(o, key), lx = flip ? m[2] : m[1], rx = flip ? m[1] : m[2];
  let k = def.H / m[4];
  if (lx > 4) k = Math.min(k, f.w * TW / lx); if (rx > 4) k = Math.min(k, f.h * TW / rx);
  const aw = Math.min(f.w, Math.max(0.3, lx * k / TW)), ah = Math.min(f.h, Math.max(0.3, rx * k / TW));
  let x = o.x + (f.w - aw) / 2, y = o.y + (f.h - ah) / 2;
  if (o.o === 0) y = o.y; else if (o.o === 2) y = o.y + f.h - ah; else if (o.o === 1) x = o.x; else x = o.x + f.w - aw;
  return {x, y, w:aw, h:ah, k, m, flip};

function objMirrorRaw(o, key){

  if (def.L !== def.D && m && Math.max(m[1], m[2]) > 1.2 * Math.min(m[1], m[2])) return (m[1] > m[2]) !== wantX;

// ---------- handyman jobs ----------
function adjTile(tiles){

  if (S.objs.some(o => o.key === 'reception')) t.push('lobbyPigeon');
  if (S.rooms.some(r => r.type === 'ward' && r.state === 'ready')) t.push('wardCat');
  return t;
}
function startChaos(type){
  const c = {type, taps:0, need: type === 'powerCut' ? 5 : 3, until:S.time + 30};
  if (type === 'powerCut'){ c.x = S.ent + 1.5; c.y = S.bh + 0.5; S.freezeUntil = Infinity; }
  if (type === 'lobbyPigeon'){ const d = pick(S.objs.filter(o => o.key === 'reception')); c.at = 'o' + d.id; const sp = spotOf(d, 'p'); c.x = sp.x + 0.3; c.y = sp.y - 0.4; }
  if (type === 'wardCat'){ const w = pick(S.rooms.filter(r => r.type === 'ward' && r.state === 'ready')); c.at = 'r' + w.id; const sp = freeTileIn(w); c.x = sp.x; c.y = sp.y; S.blocks[c.at] = Infinity; }
  S.chaos = c; S.chaosToday = type; pa('event', {}, CONTENT.chaos[type].announce); sfx('empty');
}
function endChaos(auto){
  const c = S.chaos; if (!c) return;
  if (c.type === 'powerCut') S.freezeUntil = 0;
  if (c.type === 'wardCat') S.blocks[c.at] = 0;
  S.chaos = null; sfx('fix'); floatText(c.x, c.y, auto ? 'Sorted itself out' : 'Fixed!', '#3fc33a');
  pa('event', {}, CONTENT.chaos[c.type].fixed);
}
function tickChaos(){
  if (S.chaosPlan && !S.chaosPlan.done && S.time >= S.chaosPlan.at){ S.chaosPlan.done = true; if (chaosTypes().includes(S.chaosPlan.type)) startChaos(S.chaosPlan.type); }
  if (S.chaos){
    if (S.chaos.type === 'wardCat') S.staff.forEach(s => { if (s.assigned === S.chaos.at) s.mood = Math.max(0, s.mood - 1.5 * STEP); });
    if (S.time >= S.chaos.until) endChaos(true);
  }
}

  S.cash -= 20; p.queue = p.queue.filter(id => id !== pt.id); p.queue.unshift(pt.id);

}
function kopiRound(){

function buyResearch(k){ if (S.research[k] || S.cash < RESEARCH[k].cost) return; S.cash -= RESEARCH[k].cost; S.research[k] = true; sfx('star'); if (k === 'digitalization') pa('digitalization_bought'); if (k === 'autoRefill') S.objs.forEach(o => { o.empty = false; }); save(); }

function headline(R){

// Every corridor item has a job:
//   Storage Shelf  – raises the supplies the Pharmacy and Records Office can hold
//   Fire Extinguisher – puts out a fire within 5 tiles by itself
//   Notice Board   – patients within 6 tiles don't get lost
//   Water Cooler   – free drink for thirsty patients (+8 patience)

const frontOf = o => toWorld(o, OBJ[o.key].L / 2, OBJ[o.key].D + 0.5);
const objNear = (pos, key, r) => S.objs.find(o => o.key === key && Math.abs(o.x + OBJ[o.key].L / 2 - pos.x) <= r && Math.abs(o.y + 0.5 - pos.y) <= r);

// ---------- supplies (used by the Pharmacy and the Records Office) ----------
function supplyCap(){ return 30 + 20 * S.objs.filter(o => o.key === 'shelf').length + (S.research.bulkStamps ? 20 : 0); }
const usesSupplies = p => p.type === 'pharmacy' || p.type === 'records';
function supplyNeed(p, pt){ return p.type === 'records' && AILMENTS[pt.ailment].doubleStamp ? 2 : 1; }
function supplyCost(){ return Math.max(10, supplyCap() - S.stamps); }
function orderSupplies(){
  if (S.stampOrderAt !== null || S.stamps >= supplyCap()) return;
  const c = supplyCost(); if (S.cash < c) return;
  S.cash -= c;
  if (S.phase !== 'open'){ S.stamps = supplyCap(); S.stampsWarned = false; }
  else S.stampOrderAt = S.time + 10;
  sfx('click'); toast('📦 Supplies ordered: −$' + c + (S.phase === 'open' ? '. Arriving in 10 s.' : '.'));
}
function suppliesArrive(){ S.stamps = supplyCap(); S.stampOrderAt = null; S.stampsWarned = false; sfx('fix'); pa('event', {}, ['Supplies have arrived. They have been counted, signed for and counted again.', 'The supply van is here. It only took three forms.']); }

// ---------- fires ----------
const FIRE_ITEMS = ['copier', 'kopi', 'vending', 'scanner', 'console', 'monitor'];
const FIRE_PA = {
  start:['Small fire reported near the {item}. Please remain calm and continue queueing.', 'A fire has started near the {item}. A committee to discuss it has been formed.', 'Fire near the {item}! Please do not panic; panicking requires a separate form.'],
  auto:['The fire extinguisher has handled the fire. It will receive a certificate.', 'Fire out. The extinguisher has been nominated Employee of the Month.'],
  out:['Fire out. Thank you for your service. Please return the hose.', 'The fire is out. The paperwork is only just catching fire.'],
  burnt:['The {item} has burnt out. A replacement has been requested in triplicate.', 'Fire damage: one {item}. Morale: also slightly singed.']
};
function planFire(){ S.firePlan = S.day >= 2 && rand() < 0.6 ? {at:40 + rand() * 160, done:false} : null; S.fire = null; }
function startFire(o){
  const name = OBJ[o.key].name;
  S.fire = {obj:o.id, x:o.x + OBJ[o.key].L / 2, y:o.y + 0.5, t0:S.time, taps:0, need:4, until:S.time + 22, name};
  const ext = objNear({x:S.fire.x, y:S.fire.y}, 'extinguisher', 5);
  if (ext) S.fire.autoAt = S.time + 2.5;
  else { const rid = roomAt(o.x, o.y); if (rid) { S.fire.room = 'r' + rid; S.blocks[S.fire.room] = Infinity; } }
  pa('event', {item:name.toLowerCase()}, FIRE_PA.start); sfx('empty');
  addLog('🔥 Fire near the ' + name + '!' + (ext ? ' The extinguisher is on it.' : ' Tap the fire to put it out. Tip: an extinguisher nearby puts fires out by itself.'), 'alert', {x:S.fire.x, y:S.fire.y});
}
function endFire(how){
  const f = S.fire; if (!f) return;
  if (f.room) S.blocks[f.room] = 0;
  const o = objById(f.obj);
  if (how === 'burnt' && o){ o.broken = true; S.ratings.push(1); S.lvRateSum += 1; S.lvRateN++; }
  floatText(f.x, f.y, how === 'auto' ? '🧯 Put out!' : how === 'out' ? 'Fire out!' : 'Burnt out!', how === 'burnt' ? '#ff4f4f' : '#3fc33a');
  pa('event', {item:f.name.toLowerCase()}, FIRE_PA[how]); sfx(how === 'burnt' ? 'empty' : 'fix');
  S.fire = null;
}
function tickFire(){
  if (S.firePlan && !S.firePlan.done && S.time >= S.firePlan.at){
    S.firePlan.done = true;
    const c = S.objs.filter(o => FIRE_ITEMS.includes(o.key) && !o.broken);
    if (c.length && !S.fire) startFire(pick(c));
  }
  const f = S.fire; if (!f) return;
  if (f.autoAt && S.time >= f.autoAt) return endFire('auto');
  if (S.time >= f.until) return endFire('burnt');
  // people near the flames get nervous
  for (const pt of S.patients) if (Math.abs(pt.pos.x - f.x) < 3 && Math.abs(pt.pos.y - f.y) < 3) pt.patience = Math.max(1, pt.patience - 1.2 * STEP);
}
function tapFire(){ const f = S.fire; if (!f || f.autoAt) return; if (++f.taps >= f.need) endFire('out'); else { sfx('click'); floatText(f.x, f.y, 'Psssh!', '#7fd4ff'); } }

// ---------- getting lost (big hospitals, far from a notice board) ----------
const LOST_LINES = ['Is this Pharmacy? It looks like a corridor.', 'I have been walking for 20 minutes. I think.', 'The sign said "this way". Which way?', 'I followed the arrows. The arrows were lying.'];
function maybeLost(pt){
  if (pt.wander || pt.vip || pt.emergency || pt.path.length < 11) return;
  if (objNear(pt.pos, 'noticeboard', 6)) return;
  if (rand() >= 0.25) return;
  // wander off to a nearby corridor spot first
  const here = tileOfPt(pt.pos), spots = [];
  for (let y = here.y - 5; y <= here.y + 5; y++) for (let x = here.x - 5; x <= here.x + 5; x++) if (inMap(x, y) && isCorridor(x, y) && !objAt(x, y)) spots.push({x, y});
  if (!spots.length) return;
  const t = pick(spots); pt.wander = true; walkPath(pt, {x:t.x + 0.5, y:t.y + 0.5});
  if (!S.lostTold){ S.lostTold = true; addLog('❓ A patient got lost. Notice Boards stop patients getting lost nearby.', 'advice', pt.pos); }
}
function lostArrived(pt){ pt.wander = false; pt.at = null; pt.repath = true; if (rand() < 0.6) showBubble(pt, pick(LOST_LINES), 3); }

// ---------- drinks: vending machine (+$5, +15) or water cooler (free, +8) ----------
function findDrink(pt){
  let best = null, bd = 14;
  for (const o of S.objs){ if (o.key !== 'vending' && o.key !== 'cooler') continue; const sp = o.key === 'vending' ? spotOf(o, 'p') : frontOf(o); const d = Math.abs(sp.x - pt.pos.x) + Math.abs(sp.y - pt.pos.y); if (d < bd){ bd = d; best = {o, sp}; } }
  return best;
}
function finishDrink(pt){
  const o = objById(pt.drinkObj), cooler = o && o.key === 'cooler';
  pt.drinkUntil = 0; pt.drank = true;
  if (cooler){ pt.patience = Math.min(100, pt.patience + 8); floatText(pt.pos.x, pt.pos.y, '💧 +8', '#7fd4ff'); }
  else { pt.patience = Math.min(100, pt.patience + 15); S.cash += 5; S.earned += 5; floatText(pt.pos.x, pt.pos.y, '+$5 🥤', '#3fc33a'); sfx('ticket'); }
}


// ================== drawing ==================
const cv = $('cv'), g = cv.getContext('2d');
let dpr = 1, now = 0, floaters = [], fx = [];
const cam = {x:0, y:0, z:1, fitted:false};
const iso = (x, y) => [(x - y) * TW, (x + y) * TH];
const toScreen = (x, y, z = 0) => [cam.x + (x - y) * TW * cam.z, cam.y + ((x + y) * TH - z) * cam.z];
function screenToWorld(sx, sy){ const u = (sx - cam.x) / cam.z, v = (sy - cam.y) / cam.z; return {x:(u / TW + v / TH) / 2, y:(v / TH - u / TW) / 2}; }
function resize(){ dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
addEventListener('resize', () => { resize(); clampCam(); });
function mapBox(){ return {x0:-S.H * TW - 20, x1:S.W * TW + 20, y0:-WALL - 40, y1:(S.W + S.H) * TH + 20}; }
function fitCamera(){
  const top = ($('hud').offsetHeight || 46) + 4, bottom = ($('toolbar').offsetHeight || 84) + 4;
  const b = mapBox(), availW = innerWidth - 20, availH = innerHeight - top - bottom;
  cam.z = clamp(Math.min(availW / (b.x1 - b.x0), availH / (b.y1 - b.y0)) * 1.05, 0.45, 2.4);
  cam.x = 10 + (availW - (b.x1 - b.x0) * cam.z) / 2 - b.x0 * cam.z;
  cam.y = top + (availH - (b.y1 - b.y0) * cam.z) / 2 - b.y0 * cam.z;
  cam.fitted = true;
}
function clampCam(){
  if (!S) return;
  const b = mapBox(), m = 120;
  cam.x = clamp(cam.x, innerWidth - m - b.x1 * cam.z, m - b.x0 * cam.z);
  cam.y = clamp(cam.y, innerHeight - m - b.y1 * cam.z, m - b.y0 * cam.z);
}
function zoomAt(sx, sy, f){
  const w = screenToWorld(sx, sy); cam.z = clamp(cam.z * f, 0.45, 2.6);
  const [nx, ny] = toScreen(w.x, w.y); cam.x += sx - nx; cam.y += sy - ny; clampCam();
}
function floatText(x, y, text, color){ floaters.push({text, color, x, y, t0:performance.now()}); }
function fxBurst(x, y, kind){
  if (SET.calm) return;
  const cols = ['#ff5d8f', '#ffd23f', '#3fc33a', '#3b8bff', '#a66bff'];
  for (let i = 0; i < 16; i++){ const a = fxRand() * 6.28, sp = 30 + fxRand() * 50; fx.push({x, y, vx:Math.cos(a) * sp, vy:-40 - fxRand() * 60 + Math.sin(a) * 20, col:cols[i % 5], t0:performance.now(), kind}); }
}
// ---------- textures bent into the isometric view ----------
function tileTex(x, y){
  if (y === S.bh) return 6; if (y > S.bh) return 7;
  const r = roomAt(x, y); if (r){ const R = roomById(r); return R ? ROOMS[R.type].floor : 0; }
  return Math.abs(x - S.ent) + (S.bh - 1 - y) <= 3 ? 3 : 0;
}
function drawFloorTile(x, y, tex){
  const [ox, oy] = iso(x, y), key = 'floor:' + tex;
  if (hasSprite(key)){
    g.save(); g.transform(TW, TH, -TW, TH, ox, oy); g.drawImage(SPRITES[key], -0.01, -0.01, 1.02, 1.02); g.restore();
  } else {
    P([iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)]); g.fillStyle = FLOOR_COLORS[tex][(x + y) % 2]; g.fill();
  }
}
function drawFloors(){
  const fc = floorLayer(); g.drawImage(fc.cv, fc.b.x0, fc.b.y0, fc.cv.width / fc.sc, fc.cv.height / fc.sc);
  // road markings and kerb
  for (let x = 0; x < S.W; x += 2){ P([iso(x + 0.3, S.bh + 1.45), iso(x + 1.2, S.bh + 1.45), iso(x + 1.2, S.bh + 1.57), iso(x + 0.3, S.bh + 1.57)]); g.fillStyle = '#ffe36e'; g.fill(); }
  // entrance mat
  P([iso(S.ent + 0.1, S.bh - 0.9), iso(S.ent + 0.9, S.bh - 0.9), iso(S.ent + 0.9, S.bh - 0.1), iso(S.ent + 0.1, S.bh - 0.1)]); fillInk('#ff5d5d', 1.5);
  if (S.flood && !S.flood.mopped && S.flood.x !== undefined){ P([iso(S.flood.x + 0.05, S.flood.y + 0.05), iso(S.flood.x + 0.95, S.flood.y + 0.05), iso(S.flood.x + 0.95, S.flood.y + 0.95), iso(S.flood.x + 0.05, S.flood.y + 0.95)]); fillInk('rgba(80,170,255,.8)', 1.5); }
  // unfinished rooms get a dashed outline
  for (const r of S.rooms) if (r.state !== 'ready'){ P([iso(r.x + 0.05, r.y + 0.05), iso(r.x + r.w - 0.05, r.y + 0.05), iso(r.x + r.w - 0.05, r.y + r.h - 0.05), iso(r.x + 0.05, r.y + r.h - 0.05)]); g.setLineDash([6, 5]); g.lineWidth = 2.5; g.strokeStyle = '#ff8c3a'; g.stroke(); g.setLineDash([]); }
}
// a wall segment along one tile edge; tex is a flat front-view picture bent onto it
function wallSeg(p0, p1, h, tex, col, darker){
  const ux = p1[0] - p0[0], uy = p1[1] - p0[1];
  if (tex && hasSprite(tex)){
    const im = SPRITES[tex];
    g.save(); g.transform(ux, uy, 0, h, p0[0], p0[1] - h);
    if (h < WALL * 0.6) g.drawImage(im, 0, im.naturalHeight * 0.78, im.naturalWidth, im.naturalHeight * 0.22, 0, 0, 1, 1);
    else g.drawImage(im, 0, 0, 1, 1);
    g.restore();
    if (darker){ P([p0, p1, [p1[0], p1[1] - h], [p0[0], p0[1] - h]]); g.fillStyle = 'rgba(40,20,60,.13)'; g.fill(); }
  } else {
    P([p0, p1, [p1[0], p1[1] - h], [p0[0], p0[1] - h]]); g.fillStyle = darker ? shade(col, -0.1) : col; g.fill();
    if (h > 20){ P([p0, p1, [p1[0], p1[1] - 5], [p0[0], p0[1] - 5]]); g.fillStyle = shade(col, -0.28); g.fill(); }
  }
  P([p0, p1, [p1[0], p1[1] - h], [p0[0], p0[1] - h]]); ink(2);
  g.beginPath(); g.moveTo(p0[0], p0[1] - h); g.lineTo(p1[0], p1[1] - h); g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,.7)'; g.stroke();
}
function wallItems(items){
  const INCOL = '#ffe6bd', OUTCOL = '#ffc27a';
  const push = (key, fn, box, h) => items.push({key, draw:fn, box, h:h || 90});
  // horizontal edges: between (x, y-1) [far] and (x, y) [near]
  for (let y = 0; y <= S.bh; y++) for (let x = 0; x < S.bw; x++){
    const v = wallH(x, y); if (!v) continue;
    const outer = y === 0 || y === S.bh, nearRoom = y < S.bh ? roomAt(x, y) : 0, farRoom = y > 0 ? roomAt(x, y - 1) : 0;
    const tall = y === 0 || (!S.wallsDown && y < S.bh && nearRoom && nearRoom !== farRoom);
    const p0 = iso(x, y), p1 = iso(x + 1, y), bx = [x, y, x + 1, y], k = x + y + 0.5;
    if (v === 2){ if (tall) push(k, () => wallSeg(p0, p1, WALL, 'tile:door-in', '#c9783f', false), bx); else push(k, () => { doorPosts(p0, p1, outer); }, bx, 40); continue; }
    const tex = outer ? (x % 3 === 1 ? 'tile:wall-out-window' : 'tile:wall-out') : 'tile:wall-in';
    push(k, () => wallSeg(p0, p1, tall ? (outer ? WALL + 6 : WALL) : LOW, tex, outer ? OUTCOL : INCOL, false), bx, tall ? 90 : 30);
  }
  // vertical edges: between (x-1, y) [far] and (x, y) [near]
  for (let y = 0; y < S.bh; y++) for (let x = 0; x <= S.bw; x++){
    const v = wallV(x, y); if (!v) continue;
    const outer = x === 0 || x === S.bw, nearRoom = x < S.bw ? roomAt(x, y) : 0, farRoom = x > 0 ? roomAt(x - 1, y) : 0;
    const tall = x === 0 || (!S.wallsDown && x < S.bw && nearRoom && nearRoom !== farRoom);
    const p0 = iso(x, y), p1 = iso(x, y + 1), bx = [x, y, x, y + 1], k = x + y + 0.5;
    if (v === 2){ if (tall) push(k, () => wallSeg(p0, p1, WALL, 'tile:door-in', '#c9783f', true), bx); else push(k, () => doorPosts(p0, p1, outer), bx, 40); continue; }
    const tex = outer ? (y % 3 === 1 ? 'tile:wall-out-window' : 'tile:wall-out') : 'tile:wall-in';
    push(k, () => wallSeg(p0, p1, tall ? (outer ? WALL + 6 : WALL) : LOW, tex, outer ? OUTCOL : INCOL, true), bx, tall ? 90 : 30);
  }
}
function doorPosts(p0, p1, outer){
  for (const p of [p0, p1]){ g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0], p[1] - 14); g.lineWidth = 4; g.strokeStyle = OL; g.stroke(); }
  if (outer){ const m = lerp(p0, p1, 0.5); plateW(m[0], m[1] - 26, 'ENTRANCE', '#ff5d8f'); }
}
function plateW(x, y, text, bg){ g.font = 'bold 9px "Comic Sans MS",sans-serif'; const w = g.measureText(text).width + 10; g.beginPath(); g.roundRect(x - w / 2, y - 7, w, 14, 7); g.fillStyle = bg; g.fill(); g.lineWidth = 1.5; g.strokeStyle = OL; g.stroke(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, x, y + 0.5); }
// ---------- furniture ----------
function objMirror(o){ const def = OBJ[o.key]; return objMirrorRaw(o, o.o >= 2 && def.back && hasSprite(def.back) ? def.back : def.spr); }
function drawObj(o, alpha = 1){
  const def = OBJ[o.key], f = foot(def, o.o);
  let key = o.o >= 2 && def.back && hasSprite(def.back) ? def.back : def.spr;
  if (o.jam && def.jamSpr && hasSprite(def.jamSpr)) key = def.jamSpr;
  if (o.key === 'toilet' && o.o < 2 && S.looTaken && S.looTaken[o.id] && hasSprite('prop:toilet-occupied')) key = 'prop:toilet-occupied';
  if (o.key === 'ticket' && o.empty && hasSprite('prop:ticket-machine-empty')) key = 'prop:ticket-machine-empty';
  const occ = LIE_ON.includes(o.key) ? S.patients.find(p => p.svcObj === o.id && p.st === 'serve') : null;
  let [cx] = iso(o.x + f.w / 2, o.y + f.h / 2), [, fy] = iso(o.x + f.w, o.y + f.h);
  g.globalAlpha = alpha;
  if (hasSprite(key)){
    const R = objRect(o, key);
    if (R.m){
      const im = SPRITES[key], [ax, ay] = iso(R.x + R.w, R.y + R.h), k = R.k;
      cx = ax; fy = ay;
      // facing away with no back picture yet: shade it so the turn is visible
      const shade = o.o >= 2 && !(def.back && hasSprite(def.back)) && !SYMMETRIC.includes(o.key);

// ---------- draw order ----------
// Items carry a floor box [x0, y0, x1, y1]. An item that lies wholly behind another on either floor axis
// is drawn first; only items whose pictures can overlap on screen are compared. Others fall back to key order.
function depthSort(items){
  items.sort((a, b) => a.key - b.key);
  const n = items.length, R = new Array(n);
  for (let i = 0; i < n; i++){
    const it = items[i], b = it.box; if (!b){ R[i] = null; continue; }
    const xs = [b[0] - b[1], b[2] - b[1], b[0] - b[3], b[2] - b[3]], ys = [b[0] + b[1], b[2] + b[1], b[0] + b[3], b[2] + b[3]];
    R[i] = {l:Math.min(...xs) * TW - 18, r:Math.max(...xs) * TW + 18, t:Math.min(...ys) * TH - (it.h || 80), b:Math.max(...ys) * TH + 4};
  }
  const pre = Array.from({length:n}, () => []), e = 1e-3;
  for (let i = 0; i < n; i++){ const A = R[i]; if (!A) continue; const a = items[i].box;
    for (let j = i + 1; j < n; j++){ const B = R[j]; if (!B || A.r <= B.l || B.r <= A.l || A.b <= B.t || B.b <= A.t) continue;
      const b = items[j].box;
      const ab = a[2] <= b[0] + e || a[3] <= b[1] + e, ba = b[2] <= a[0] + e || b[3] <= a[1] + e;
      if (ab && !ba) pre[j].push(i); else if (ba && !ab) pre[i].push(j); else pre[j].push(i); // items are key-sorted, so i <= j by key
    }
  }
  const out = [], st = new Uint8Array(n);
  const visit = i => { if (st[i]) return; st[i] = 1; for (const j of pre[i]) visit(j); out.push(items[i]); };
  for (let i = 0; i < n; i++) visit(i);
  return out;
}

function drawFire(f){
  // drawn in world space (the camera is already applied), so use iso(), not toScreen()
  const [sx, sy0] = iso(f.x, f.y), t = now / 1000, sy = sy0 + 4;
  g.save();
  g.globalAlpha = 0.45; g.fillStyle = '#ff6a00'; g.beginPath(); g.ellipse(sx, sy, 30, 13, 0, 0, 7); g.fill();
  g.globalAlpha = f.autoAt ? 0.65 : 1; g.textAlign = 'center'; g.textBaseline = 'bottom';
  for (let i = 0; i < 4; i++){ const sz = 26 + 9 * Math.sin(t * 9 + i * 1.7); g.font = sz + 'px serif'; g.fillText('🔥', sx + (i - 1.5) * 13, sy - (i % 2 ? 14 : 2) - 4 * Math.sin(t * 7 + i)); }
  g.globalAlpha = 0.35; g.fillStyle = '#555'; for (let i = 0; i < 3; i++){ const r = 7 + ((t * 20 + i * 12) % 30) / 2; g.beginPath(); g.arc(sx + Math.sin(t + i) * 8, sy - 50 - ((t * 20 + i * 12) % 30), r, 0, 7); g.fill(); }
  if (f.autoAt){ g.globalAlpha = 1; g.font = '28px serif'; g.fillText('🧯', sx + 32, sy - 4); }
  g.restore();
}

// ---------- auto-furnish: place every missing required item ----------
// is there a solid wall on the given side of a tile? side: 0 north (-y), 1 west (-x), 2 south (+y), 3 east (+x)
function wallSide(x, y, side){ const v = side === 0 ? wallH(x, y) : side === 2 ? wallH(x, y + 1) : side === 1 ? wallV(x, y) : wallV(x + 1, y); return v === 1; }
// auto-furnish picks the free spot that puts the item's back (or the staff's back) against a wall
function findSpot(key, r){
  const def = OBJ[key]; let best = null, bs = -1;
  for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) for (const o of [0, 1, 2, 3]){
    const g2 = {key, x, y, o, room:r.id};
    if (checkPlace(g2)) continue;
    const back = [0, 1, 2, 3][o], side1 = (back + 1) % 4, side2 = (back + 3) % 4;   // facing o: 0 +y, 1 +x, 2 -y, 3 -x -> back side 0,1,2,3
    let sc = 0;
    const tiles = def.s ? [tileOfPt(spotOf(g2, 's'))] : objTiles(g2);
    for (const t of tiles){ if (wallSide(t.x, t.y, back)) sc += 10; if (wallSide(t.x, t.y, side1) || wallSide(t.x, t.y, side2)) sc += 2; }
    if (def.s) for (const t of objTiles(g2)) if (wallSide(t.x, t.y, side1) || wallSide(t.x, t.y, side2)) sc += 1;
    // keep clear of the doorway
    if (r.door) for (const t of objTiles(g2)) sc -= Math.max(0, 3 - (Math.abs(t.x - r.door.x) + Math.abs(t.y - r.door.y)));
    if (sc > bs){ bs = sc; best = g2; }
  }
  return best;
}
function autoFurnish(r){
  const R = ROOMS[r.type], missing = [];
  for (const k of R.need){
    if (roomObjs(r).some(o => o.key === k)) continue;
    const spot = findSpot(k, r);
    if (spot){ T.roomId = r.id; placeObject(spot); } else missing.push(OBJ[k].name);
  }
  if (missing.length) toast('No space for: ' + missing.join(', ') + '. Try a bigger room or move things.', 3500);
  T.mode = 'furnish'; T.roomId = r.id; showBuildBar();
}

function tickAdvice(){

  const byType = {};
  for (const p of pts){ const t = pointType(p); if (t === 'ticket') continue; (byType[t] = byType[t] || []).push(p); }
  for (const [t, list] of Object.entries(byType)){
    const q = list.reduce((a, p) => a + p.queue.length, 0), name = t === 'reception' ? 'Reception' : ROOMS[t].name;
    if (q >= 7 && list.length < 3){ const busiest = list.reduce((a, b) => a.queue.length >= b.queue.length ? a : b); advise('queue_' + t, `The ${name} queue is ${q} long. Build another ${t === 'reception' ? 'Reception Desk' : name} to share the load.`, pointAt(busiest)); }
  }

    const role = pointRole(p);
    if (role && p.queue.length && !S.staff.some(s => s.assigned === keyOf(p))) advise('nostaff_' + keyOf(p), `Nobody works at the ${pointName(p)}. Hire a ${ROLES[role].name}, or drop one in.`, pointAt(p));

    if (standing >= 4) advise('stand_' + keyOf(p), `${standing} patients are standing outside the ${pointName(p)}. Put benches near its door.`, pointAt(p));
  }
  if (S.patients.some(p => p.needLoo) && !S.rooms.some(r => r.type === 'toilet' && r.state === 'ready')) advise('toilet', 'Patients are desperate for the toilet. Build Toilets (Build, then Toilets).', {x:S.ent + 0.5, y:S.bh - 1.5});

  const broken = S.objs.find(o => o.broken);

// ---------- charts ----------
function drawChart(cvs){
  const H = S.history || [], c = cvs.getContext('2d'), W = cvs.width, Hh = cvs.height;
  c.clearRect(0, 0, W, Hh); c.font = '11px sans-serif'; c.fillStyle = '#2b2238';
  if (!H.length){ c.fillText('The chart fills in after your first day.', 10, Hh / 2); return; }
  const maxM = Math.max(100, ...H.map(h => Math.max(h.earned, h.wages))), maxC = Math.max(5, ...H.map(h => h.cures));
  const bw = Math.min(36, (W - 30) / H.length), pad = 24, base = Hh - 18;
  H.forEach((h, i) => {
    const x = pad + i * bw;
    c.fillStyle = SET.cb ? '#2f6fd6' : '#3fc33a'; c.fillRect(x, base - (h.earned / maxM) * (base - 12), bw * 0.4, (h.earned / maxM) * (base - 12));
    c.fillStyle = SET.cb ? '#f08c00' : '#ff4f7c'; c.fillRect(x + bw * 0.42, base - (h.wages / maxM) * (base - 12), bw * 0.4, (h.wages / maxM) * (base - 12));
    c.fillStyle = '#2b2238'; c.fillText(h.day, x + bw * 0.25, Hh - 4);

  c.strokeStyle = '#7a5cff'; c.lineWidth = 2.5; c.beginPath();
  H.forEach((h, i) => { const x = pad + i * bw + bw * 0.4, y = base - (h.cures / maxC) * (base - 12); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
  H.forEach((h, i) => { const x = pad + i * bw + bw * 0.4, y = base - (h.cures / maxC) * (base - 12); c.beginPath(); c.arc(x, y, 3, 0, 7); c.fillStyle = '#7a5cff'; c.fill(); });

}

// ---------- cached floor layer (only redrawn when the layout or zoom changes) ----------
let layoutV = 0, floorCache = null;
function floorLayer(){
  const b = mapBox(), sc = clamp(Math.pow(1.25, Math.round(Math.log(cam.z * dpr) / Math.log(1.25))), 0.8, 3.2);
  const loaded = Array.from({length:9}, (_, i) => hasSprite('floor:' + i) ? 1 : 0).join('');
  const key = layoutV + '|' + sc + '|' + loaded + '|' + S.W + 'x' + S.H;
  if (floorCache && floorCache.key === key) return floorCache;
  const W = Math.ceil((b.x1 - b.x0) * sc), H = Math.ceil((b.y1 - b.y0) * sc);
  const c = floorCache && floorCache.cv.width === W && floorCache.cv.height === H ? floorCache.cv : document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.setTransform(sc, 0, 0, sc, -b.x0 * sc, -b.y0 * sc);
  for (let ty = 0; ty < S.H; ty++) for (let tx = 0; tx < S.W; tx++){
    const tex = tileTex(tx, ty), [ox, oy] = iso(tx, ty), k = 'floor:' + tex;
    if (hasSprite(k)){ x.save(); x.transform(TW, TH, -TW, TH, ox, oy); x.drawImage(SPRITES[k], -0.01, -0.01, 1.02, 1.02); x.restore(); }
    else { x.beginPath(); [iso(tx, ty), iso(tx + 1, ty), iso(tx + 1, ty + 1), iso(tx, ty + 1)].forEach(([a, bb], i) => i ? x.lineTo(a, bb) : x.moveTo(a, bb)); x.closePath(); x.fillStyle = FLOOR_COLORS[tex][(tx + ty) % 2]; x.fill(); }
    x.beginPath(); [iso(tx, ty), iso(tx + 1, ty), iso(tx + 1, ty + 1), iso(tx, ty + 1)].forEach(([a, bb], i) => i ? x.lineTo(a, bb) : x.moveTo(a, bb)); x.closePath(); x.lineWidth = 0.6; x.strokeStyle = 'rgba(43,34,56,.10)'; x.stroke();

}

function problems(){

  if (!S || S.phase !== 'open') return out;
  if (S.fire && !S.fire.autoAt) add('🔥', 'Fire near the ' + S.fire.name + '! Tap the flames.', {x:S.fire.x, y:S.fire.y}, 'fire');
  if (S.chaos) add(S.chaos.type === 'powerCut' ? '⚡' : S.chaos.type === 'wardCat' ? '🐈' : '🐦', S.chaos.type === 'powerCut' ? 'Power cut! Tap the generator by the entrance.' : S.chaos.type === 'wardCat' ? 'A cat is in the ward. Tap it.' : 'A pigeon is at Reception. Tap it.', {x:S.chaos.x, y:S.chaos.y}, 'chaos');
  if (S.emergency) add('🚑', 'Emergency patients are waiting for the Emergency room.', null, 'emerg');
  for (const o of S.objs){
    const at = {x:o.x + 0.5, y:o.y + 0.5};
    if (o.broken) add('🔧', OBJ[o.key].name + ' is broken. A handyman will fix it, or tap it to pay for a repair.', at, 'b' + o.id);
    else if (o.jam) add('🖨️', 'The photocopier is jammed. Tap it 3 times.', at, 'j' + o.id);
    if (o.key === 'ticket' && o.empty) add('🎫', 'The ticket machine is out of paper. Tap it.', at, 't' + o.id);
    if (o.key === 'toilet' && (o.dirt || 0) >= 50) add('🧻', 'A toilet is filthy. Handymen clean toilets.' + (S.staff.some(s => s.role === 'handyman') ? '' : ' Hire one!'), at, 'd' + o.id);

  click(e.clientX, e.clientY);
});
cv.addEventListener('wheel', e => { if (!S) return; e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12); }, {passive:false});
addEventListener('keydown', e => {
  if (!S || $('title').style.display !== 'none' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); undo(); return; }
  if (k === 'r') rotateGhost();
  if (k === 'escape'){ if (S.held) dropBack(); else if (T.mode) cancelTool(); else closeSheet(); }
  if (e.code === 'Space'){ e.preventDefault(); setSpeed(speed === 0 ? 1 : 0); }
  if (k === '1') setSpeed(1); if (k === '2') setSpeed(2); if (k === '3') setSpeed(3);
  if (k === 'l') S.labels = !S.labels;
  const pan = 40; if (k === 'arrowleft' || k === 'a') cam.x += pan; if (k === 'arrowright' || k === 'd') cam.x -= pan; if (k === 'arrowup' || k === 'w') cam.y += pan; if (k === 'arrowdown' || k === 's') cam.y -= pan; clampCam();
});
// pick furniture by its picture, not just the floor tile under the cursor
function objectAtScreen(sx, sy){
  let best = null, bk = -1e9;
  for (const o of S.objs){
    const def = OBJ[o.key], f = foot(def, o.o);
    const [cx, cy] = toScreen(o.x + f.w / 2, o.y + f.h / 2), [, fy] = toScreen(o.x + f.w, o.y + f.h);
    const w = Math.max(def.W, (f.w + f.h) * TW) * cam.z * 0.5, h = def.H * cam.z;
    const hitPic = sx >= cx - w && sx <= cx + w && sy >= fy - h && sy <= fy + 4;
    const t = screenToWorld(sx, sy), onTile = Math.floor(t.x) >= o.x && Math.floor(t.x) < o.x + f.w && Math.floor(t.y) >= o.y && Math.floor(t.y) < o.y + f.h;
    if ((hitPic || onTile) && objKey(o) > bk){ bk = objKey(o); best = o; }
  }
  return best;
}
function click(sx, sy){
  const w = screenToWorld(sx, sy), tx = Math.floor(w.x), ty = Math.floor(w.y);
  if (S.held){ dropAt(w); return; }
  if (T.mode === 'door'){ if (T.doorPick) placeDoor(T.doorPick); return; }
  if (T.mode === 'place'){ if (T.ghost){ const ok = placeObject(T.ghost); if (ok && T.roomId) { /* back to furnishing */ } } return; }
  if (T.mode === 'furnish'){ const o = objectAtScreen(sx, sy); if (o && o.room === T.roomId){ openObjCard(o); } return; }
  if (T.mode === 'room') return;
  // quick fixes first
  if (S.phase === 'open'){
    if (S.fire && !S.fire.autoAt){ const [fx, fy] = toScreen(S.fire.x, S.fire.y, 20); if (Math.hypot(sx - fx, sy - fy) < 50 * Math.max(0.8, cam.z)){ tapFire(); return; } }
    if (S.chaos){ const c = S.chaos, [cx, cy] = toScreen(c.x, c.y, 10); if (Math.hypot(sx - cx, sy - cy) < 40 * Math.max(0.8, cam.z)){ if (++c.taps >= c.need) endChaos(false); else { sfx('click'); floatText(c.x, c.y, c.type === 'powerCut' ? 'Brrrm…' : 'Shoo!', '#ffd23f'); } return; } }
    if (S.flood && !S.flood.mopped && S.flood.x === tx && S.flood.y === ty){ if (++S.flood.taps >= 3){ S.flood.mopped = true; rebuildGrid(); sfx('fix'); floatText(tx + 0.5, ty + 0.5, 'Mopped!', '#3fc33a'); for (const a of [...S.patients, ...S.staff]) a.repath = true; } else sfx('click'); return; }
  }
  const o = objectAtScreen(sx, sy);
  if (o && o.key === 'copier' && o.jam){ if (++o.jamTaps >= 3){ o.jam = false; sfx('fix'); floatText(o.x + 0.5, o.y + 0.5, 'Unjammed!', '#3fc33a'); } else sfx('click'); return; }
  if (o && o.key === 'ticket' && o.empty){ o.empty = false; sfx('fix'); floatText(o.x + 0.5, o.y + 0.5, 'Refilled!', '#3fc33a'); return; }
  const hp = personAt(sx, sy);
  if (hp){ if (hp.kind === 'staff' && hp.a.napping){ hp.a.napping = false; sfx('fix'); staffSay(hp.a, pick(CONTENT.staff.woken)); return; } sfx('click'); hp.kind === 'staff' ? openStaffCard(hp.a) : openPatientCard(hp.a); return; }
  if (o){ sfx('click'); openObjCard(o); return; }
  const r = roomById(roomAt(tx, ty)); if (r){ sfx('click'); openRoomCard(r); return; }
  closeSheet();
}
// ---------- grab and drop ----------
function pickUp(kind, id){
  if (S.held) dropBack();
  const a = kind === 'staff' ? S.staff.find(s => s.id === id) : S.patients.find(p => p.id === id); if (!a) return;
  if (kind === 'patient'){
    if (a.st === 'leave'){ toast('They are on their way home.'); return; }
    if (a.st === 'loo'){ if (a.looObj && S.looTaken) delete S.looTaken[a.looObj]; a.looObj = null; a.looDone = true; a.st = 'wait'; }
    if (a.st === 'call' || a.st === 'serve'){ const p = getPoint(a.at); if (p){ p.serving = p.serving.filter(i => i !== a.id); p.queue.unshift(a.id); } a.server = null; a.svcObj = null; a.heldSt = 'wait'; }
    else a.heldSt = a.st;
    freeSeat(a); a.st = 'held';
  } else {
    if (isServing(a)) for (const pt of S.patients.filter(q => q.server === a.id)){ const p = getPoint(pt.at); if (p){ p.serving = p.serving.filter(i => i !== pt.id); p.queue.unshift(pt.id); } pt.server = null; pt.svcObj = null; pt.st = 'wait'; pt.repath = true; }
    a.heldMode = a.mode; a.mode = 'held'; a.task = null;
  }
  a.heldFrom = {...a.pos}; S.held = {kind, id}; closeSheet(); sfx('bubble');
}
function heldActor(){ if (!S.held) return null; return S.held.kind === 'staff' ? S.staff.find(s => s.id === S.held.id) : S.patients.find(p => p.id === S.held.id); }
function dropBack(){ const a = heldActor(); if (!a){ S.held = null; return; } a.pos = {...a.heldFrom}; a.prev = {...a.pos}; finishDrop(a, null); }
function dropAt(w){
  const a = heldActor(); if (!a){ S.held = null; return; }
  const t = {x:Math.floor(w.x), y:Math.floor(w.y)};
  if (!inMap(t.x, t.y) || !tileFree(t.x, t.y) || (!inBuilding(t.x, t.y) && t.y > S.bh)){ toast('You can\'t drop them there.'); sfx('error'); return; }
  const r = roomById(roomAt(t.x, t.y));
  if (r && !r.door){ toast('That room has no door yet.'); sfx('error'); return; }
  a.pos = {x:t.x + 0.5, y:t.y + 0.5}; a.prev = {...a.pos}; a.path = [];
  finishDrop(a, r, t);
}
function finishDrop(a, r, t){
  const kind = S.held.kind; S.held = null; sfx('click');
  if (kind === 'staff'){
    a.mode = 'walk'; a.repath = true; a.coverAt = null;
    let target = null;
    if (r && r.state === 'ready' && ROOMS[r.type].role === a.role) target = r;
    if (!target && t && a.role === 'receptionist'){ target = S.objs.find(o => o.key === 'reception' && Math.abs(o.x + 1 - t.x) <= 2 && Math.abs(o.y - t.y) <= 2); }
    if (target){ const k = keyOf(target); for (const s of S.staff) if (s !== a && s.assigned === k){ s.assigned = null; s.repath = true; } a.assigned = k; staffSay(a, 'Fine. New desk, same forms.'); autoAssign(); }
    else if (r && ROOMS[r.type].role && ROOMS[r.type].role !== a.role) toast('A ' + ROLES[a.role].name + ' can\'t work in the ' + ROOMS[r.type].name + '.');
  } else {
    const want = a.route[a.ri];
    a.st = a.heldSt === 'held' ? 'go' : a.heldSt || 'go';
    if (r && r.type === want && r.state === 'ready'){ leaveQueue(a); joinQueue(a, r); floatText(a.pos.x, a.pos.y, 'Moved!', '#ffd23f'); }
    else a.repath = true;
  }
}


// ================== main loop ==================
let last = performance.now(), acc = 0;
function frame(t){
  now = t;
  const dt = Math.min(0.25, (t - last) / 1000); last = t;
  if (S && $('title').style.display === 'none' && S.phase !== 'levelEnd'){
    acc += dt * (S.phase === 'open' ? speed : 1);
    let n = 0;
    while (acc >= STEP && n++ < 40){ if (S.phase === 'open') tick(); else prepTick(); acc -= STEP; }
  }
  render(S ? acc / STEP : 0); updateHud();
  requestAnimationFrame(frame);
}
// between shifts staff still walk to their posts and handymen tidy up
function prepTick(){
  for (const a of S.staff) if (a.pos){ a.prev.x = a.pos.x; a.prev.y = a.pos.y; }
  if (S.phase !== 'prep') return;
  S.time += STEP; tickStaff();
}
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
resize(); refreshTitle(); requestAnimationFrame(frame);
// test hooks
window.__jam = {
  get S(){ return S; }, T, cam,
  run(n){ for (let i = 0; i < n; i++){ if (S.phase === 'open') tick(); else prepTick(); } },
  start(li, name){ startLevel(li || 0, name || 'Test General', 0); },
  screen(x, y, z){ const [a, b] = toScreen(x, y, z || 0); return {x:a, y:b}; },
};
</script>
