<!doctype html>
<html><head><meta charset="utf-8"><title>Style mock</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import { drawCreature } from '../src/view/art.js';
const C = { abyss: '#06223F', sea: '#0B4F7A', glow: '#3FE3FF', ice: '#BFEFFF', gold: '#FFC93C', coral: '#FF5E8A', lime: '#C6FF4A', ink: '#081521', white: '#FFFFFF' };
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mode = new URLSearchParams(location.search).get('mode') || 'arcade';
let seed = 7; const R = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

function T(s, x, y, { size = 24, w = 800, align = 'left', base = 'alphabetic', fill = C.white, stroke = C.ink, sw = 6, a = 1 } = {}) {
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${w} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base;
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function goldText(s, x, y, size, align = 'center') {
  ctx.save(); ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.16; ctx.strokeStyle = C.ink; ctx.strokeText(s, x, y);
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2); g.addColorStop(0, '#FFF6C2'); g.addColorStop(0.5, C.gold); g.addColorStop(1, '#E08A00');
  ctx.fillStyle = g; ctx.fillText(s, x, y); ctx.restore();
}
function frost(x, y, w, h, r = 16) {
  rr(x, y, w, h, r); ctx.fillStyle = 'rgba(8,40,70,0.62)'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(191,239,255,0.85)'; ctx.stroke();
  rr(x + 3, y + 3, w - 6, h * 0.42, r - 3); ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill();
}

// ---------- background ----------
const g = ctx.createRadialGradient(640, 120, 40, 640, 360, 900);
g.addColorStop(0, '#1A86B8'); g.addColorStop(0.45, C.sea); g.addColorStop(1, C.abyss);
ctx.fillStyle = g; ctx.fillRect(0, 0, 1280, 720);
for (let i = 0; i < 7; i++) {                 // light rays
  const x = 200 + i * 150 + R() * 60;
  const rg = ctx.createLinearGradient(x, 0, x + 120, 720); rg.addColorStop(0, 'rgba(120,230,255,0.16)'); rg.addColorStop(1, 'rgba(120,230,255,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 70, 0); ctx.lineTo(x + 260, 720); ctx.lineTo(x + 120, 720); ctx.fill();
}
// distant reef silhouettes
ctx.fillStyle = 'rgba(6,30,55,0.75)';
ctx.beginPath(); ctx.moveTo(0, 720);
for (let x = 0; x <= 1280; x += 40) ctx.lineTo(x, 600 - Math.abs(Math.sin(x * 0.011)) * 70 - R() * 20);
ctx.lineTo(1280, 720); ctx.fill();
// coral
function coral(x, y, h, col) {
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  const br = (x0, y0, len, ang, wdt) => {
    if (len < 10) return;
    const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
    ctx.lineWidth = wdt; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    br(x1, y1, len * 0.72, ang - 0.45, wdt * 0.72); br(x1, y1, len * 0.7, ang + 0.4, wdt * 0.72);
  };
  br(x, y, h, -Math.PI / 2, 12);
}
ctx.save(); ctx.shadowColor = C.coral; ctx.shadowBlur = 14;
coral(110, 720, 70, '#C2306B'); coral(190, 720, 52, '#7E3BC9'); coral(1110, 720, 74, '#C2306B'); coral(1190, 720, 50, '#2BB59A');
ctx.restore();
// glow particles (capped)
for (let i = 0; i < 60; i++) {
  const x = R() * 1280, y = R() * 720, r = 2 + R() * 5;
  const pg = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  const col = R() < 0.7 ? '198,255,74' : '63,227,255';
  pg.addColorStop(0, `rgba(${col},0.55)`); pg.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
}

// ---------- extra fish art (new species) ----------
function outline(f) { ctx.lineWidth = 3; ctx.strokeStyle = C.ink; f(); ctx.stroke(); }
function clown(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-32, -12); ctx.lineTo(-32, 12); ctx.closePath(); ctx.fillStyle = '#FF7A1A'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, 23, 14, 0, 0, Math.PI * 2); ctx.fillStyle = '#FF8A1F'; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = C.white; for (const bx of [-12, 4]) ctx.fillRect(bx, -15, 7, 30); ctx.restore();
  ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(14, -3, 3, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
  ctx.restore();
}
function lion(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#E34B4B'; ctx.lineWidth = 3;
  for (let i = -5; i <= 5; i++) { ctx.beginPath(); ctx.moveTo(i * 5, -8); ctx.lineTo(i * 7 - 6, -40 - Math.abs(i) * 2); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(0, 0, 38, 18, 0, 0, Math.PI * 2); ctx.fillStyle = '#FBE3D3'; ctx.fill();
  ctx.save(); ctx.clip(); ctx.strokeStyle = '#C93636'; ctx.lineWidth = 6; for (let i = -34; i < 40; i += 12) { ctx.beginPath(); ctx.moveTo(i, -20); ctx.lineTo(i - 6, 20); ctx.stroke(); } ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.ellipse(0, 0, 38, 18, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(24, -4, 3.5, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
  ctx.restore();
}
function turtle(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#5DBB63';
  for (const [fx, fy, r] of [[-30, -34, 0.6], [30, -34, -0.6], [-34, 30, -0.5], [34, 30, 0.5]]) { ctx.save(); ctx.translate(fx, fy); ctx.rotate(r); ctx.beginPath(); ctx.ellipse(0, 0, 22, 9, 0, 0, 7); ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.restore(); }
  ctx.beginPath(); ctx.ellipse(56, 0, 15, 12, 0, 0, 7); ctx.fillStyle = '#7ED183'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(62, -4, 3, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 50, 40, 0, 0, 7); ctx.fillStyle = '#E8A33D'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = '#D7462F';
  for (const [hx, hy] of [[0, 0], [-24, -14], [24, -14], [-24, 14], [24, 14]]) { ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; ctx.lineTo(hx + Math.cos(a) * 11, hy + Math.sin(a) * 11); } ctx.closePath(); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); }
  ctx.restore();
}
function manta(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(60, 0); ctx.quadraticCurveTo(10, -70, -40, -60); ctx.quadraticCurveTo(-20, -10, -70, 0); ctx.quadraticCurveTo(-20, 10, -40, 60); ctx.quadraticCurveTo(10, 70, 60, 0); ctx.closePath();
  const mg = ctx.createLinearGradient(-60, -60, 60, 60); mg.addColorStop(0, '#E0469B'); mg.addColorStop(1, '#8F2FB8');
  ctx.fillStyle = mg; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,250,0.75)'; for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.arc(-30 + R() * 70, -40 + R() * 80, 3 + R() * 4, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(-130, 6); ctx.lineWidth = 4; ctx.strokeStyle = '#8F2FB8'; ctx.stroke();
  ctx.restore();
}
function octopus(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = '#FF3D6E'; ctx.shadowBlur = 30;
  ctx.strokeStyle = '#E2335A'; ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) { const sx = -60 + i * 17; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(sx, 30); ctx.bezierCurveTo(sx - 20 + i * 4, 90, sx + 30, 110, sx + (i % 2 ? 26 : -26), 140); ctx.stroke(); }
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.ellipse(0, -10, 80, 70, 0, 0, 7); ctx.fillStyle = '#F04468'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = C.white; for (const ex of [-28, 28]) { ctx.beginPath(); ctx.ellipse(ex, 0, 18, 22, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(ex + 4, 4, 8, 0, 7); ctx.fillStyle = C.ink; ctx.fill(); ctx.fillStyle = C.white; }
  // crown
  ctx.beginPath(); ctx.moveTo(-44, -66); ctx.lineTo(-30, -104); ctx.lineTo(-12, -78); ctx.lineTo(0, -114); ctx.lineTo(12, -78); ctx.lineTo(30, -104); ctx.lineTo(44, -66); ctx.closePath();
  ctx.fillStyle = C.gold; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.restore();
}
function hp(x, y, w, frac) { rr(x - w / 2, y, w, 8, 4); ctx.fillStyle = 'rgba(8,21,33,0.7)'; ctx.fill(); rr(x - w / 2 + 1, y + 1, (w - 2) * frac, 6, 3); ctx.fillStyle = frac > 0.4 ? C.lime : C.coral; ctx.fill(); }
function net(x, y, r) {
  ctx.save(); ctx.shadowColor = C.glow; ctx.shadowBlur = 16;
  ctx.strokeStyle = 'rgba(191,239,255,0.95)'; ctx.lineWidth = 2;
  for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(x, y, r * k / 3, 0, 7); ctx.stroke(); }
  for (let a = 0; a < 12; a++) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a * Math.PI / 6) * r, y + Math.sin(a * Math.PI / 6) * r); ctx.stroke(); }
  ctx.restore();
}
function bullet(x, y, dx, dy) {
  ctx.save(); ctx.shadowColor = C.glow; ctx.shadowBlur = 18;
  ctx.strokeStyle = 'rgba(63,227,255,0.5)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - dx * 40, y - dy * 40); ctx.lineTo(x, y); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fillStyle = '#E9FDFF'; ctx.fill(); ctx.restore();
}
function coinPop(x, y, s) { T(s, x, y, { size: 30, w: 900, align: 'center', fill: C.gold, sw: 7 }); }

// ---------- fish layer ----------
for (let i = 0; i < 7; i++) drawCreature(ctx, 'sardine', 300 + (i % 4) * 34, 210 + Math.floor(i / 4) * 26 + (i % 2) * 8, 1, i, { scale: 1.3 });
for (let i = 0; i < 4; i++) clown(760 + i * 44, 300 + (i % 2) * 22, 1);
drawCreature(ctx, 'snapper', 520, 420, -1, 0, { scale: 1.3 }); drawCreature(ctx, 'snapper', 580, 446, -1, 1, { scale: 1.3 });
drawCreature(ctx, 'puffer', 980, 470, -1, 0, { scale: 1.3 });
lion(240, 470, 1);
turtle(860, 170, 1); hp(860, 112, 90, 0.55);
manta(420, 560, 1);
drawCreature(ctx, 'golden_koi', 1050, 250, -1, 0.4, { scale: 1.5 });
drawCreature(ctx, 'jellyfish', 690, 520, 1, 0.3, { scale: 1.2 });
if (mode === 'arcade') { octopus(1080, 560, 0.62); hp(1080, 470, 130, 0.8); }

// nets, bullets, cannon
net(338, 226, 44); coinPop(338, 180, '+40');
net(800, 312, 44); coinPop(800, 262, '+60');
bullet(600, 300, 0.36, -0.93); bullet(470, 380, -0.3, -0.95);
// bounce trail
ctx.save(); ctx.setLineDash([4, 10]); ctx.strokeStyle = 'rgba(63,227,255,0.45)'; ctx.lineWidth = 2;
ctx.beginPath(); ctx.moveTo(640, 640); ctx.lineTo(1240, 260); ctx.lineTo(980, 90); ctx.stroke(); ctx.restore();
bullet(980, 90, -0.83, -0.55);

// cannon
function cannon(aimX, aimY) {
  const cx = 640, cy = 676;
  const dx = aimX - cx, dy = aimY - cy, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
  ctx.save(); ctx.shadowColor = C.glow; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(cx, cy + 10, 64, Math.PI, 0); ctx.fillStyle = '#18324A'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ice; ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(uy, ux));
  rr(0, -20, 96, 40, 12); const bg = ctx.createLinearGradient(0, -20, 0, 20); bg.addColorStop(0, '#E7D6FF'); bg.addColorStop(0.5, '#9B6BFF'); bg.addColorStop(1, '#5232B8');
  ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
  rr(76, -26, 26, 52, 8); ctx.fillStyle = C.gold; ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); const hg = ctx.createRadialGradient(cx - 8, cy - 8, 4, cx, cy, 30); hg.addColorStop(0, '#FFFFFF'); hg.addColorStop(1, '#3FA9FF');
  ctx.fillStyle = hg; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
}
cannon(600, 300);

// ---------- ice frame ----------
function crystal(x, y, len, ang, w) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const cg = ctx.createLinearGradient(0, -w, len, w); cg.addColorStop(0, 'rgba(230,250,255,0.95)'); cg.addColorStop(1, 'rgba(120,200,240,0.55)');
  ctx.beginPath(); ctx.moveTo(0, -w); ctx.lineTo(len * 0.8, -w * 0.6); ctx.lineTo(len, 0); ctx.lineTo(len * 0.8, w * 0.6); ctx.lineTo(0, w); ctx.closePath();
  ctx.fillStyle = cg; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
  ctx.restore();
}
for (const [cx, cy, base] of [[0, 0, 0.25], [1280, 0, Math.PI - 0.25], [0, 720, -0.25], [1280, 720, Math.PI + 0.25]]) {
  for (let i = 0; i < 5; i++) crystal(cx, cy, 70 + R() * 70, base + (R() - 0.5) * 1.2 + (cy ? -0.5 : 0.5) * (cx ? -1 : 1) * 0.6, 10 + R() * 8);
}
ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(191,239,255,0.35)'; ctx.strokeRect(3, 3, 1274, 714);

// ---------- HUD ----------
frost(16, 14, 66, 56, 14); ctx.fillStyle = C.ice; ctx.fillRect(38, 28, 8, 28); ctx.fillRect(52, 28, 8, 28);
if (mode === 'arcade') {
  frost(96, 14, 270, 56);
  T('SCORE', 112, 36, { size: 14, w: 800, fill: C.ice, stroke: null });
  goldText('12,480', 112, 54, 30, 'left');
  T('BEST 18,200', 112, 92, { size: 15, w: 700, fill: C.ice, sw: 4 });
  frost(470, 14, 340, 56);
  goldText('x2.5', 528, 43, 34);
  T('COMBO', 592, 36, { size: 13, fill: C.ice, stroke: null });
  rr(592, 46, 196, 10, 5); ctx.fillStyle = 'rgba(8,21,33,0.7)'; ctx.fill(); rr(592, 46, 130, 10, 5); ctx.fillStyle = C.lime; ctx.fill();
  frost(1090, 14, 174, 56);
  T('0:41', 1177, 52, { size: 34, w: 900, align: 'center', fill: C.white, sw: 7 });
  // ammo
  frost(330, 640, 200, 52, 14);
  T('AMMO', 346, 662, { size: 13, fill: C.ice, stroke: null });
  for (let i = 0; i < 12; i++) { rr(346 + i * 14, 670, 9, 14, 3); ctx.fillStyle = i < 8 ? C.glow : 'rgba(191,239,255,0.2)'; ctx.fill(); }
  T('18 / 24', 515, 682, { size: 16, align: 'right', fill: C.white, sw: 4 });
} else {
  frost(96, 14, 300, 56);
  T('BANK', 112, 36, { size: 14, fill: C.ice, stroke: null });
  goldText('1,385', 112, 54, 30, 'left');
  T('Pays back 97% of bets on average', 112, 92, { size: 14, w: 700, fill: C.ice, sw: 4 });
  // bet controls
  frost(456, 640, 74, 56, 16); T('−', 493, 680, { size: 40, w: 900, align: 'center', fill: C.white });
  frost(750, 640, 74, 56, 16); T('+', 787, 680, { size: 40, w: 900, align: 'center', fill: C.white });
  frost(540, 690, 200, 26, 10); T('BET 10', 640, 710, { size: 18, w: 900, align: 'center', fill: C.gold, sw: 4 });
}
// value legend
T('Golden Koi  ×40 + wheel', 1252, 104, { size: 16, w: 800, align: 'right', fill: C.gold, sw: 4 });

// power-ups
const n0 = mode === 'arcade' ? 2 : 1;
const pu = [['FREEZE', '#7FE6FF', n0], ['LOCK-ON', '#FF6B6B', n0], ['ZAP', '#FFE15A', n0]];
pu.forEach(([name, col, n], i) => {
  const x = 916 + i * 84, y = 630;
  frost(x, y, 72, 72, 18);
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fillStyle = col;
  if (i === 0) { for (let k = 0; k < 3; k++) { ctx.save(); ctx.translate(x + 36, y + 34); ctx.rotate(k * Math.PI / 3); ctx.fillRect(-3, -20, 6, 40); ctx.restore(); } }
  if (i === 1) { ctx.lineWidth = 5; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(x + 36, y + 34, 16, 0, 7); ctx.stroke(); ctx.fillRect(x + 33, y + 10, 6, 48); ctx.fillRect(x + 12, y + 31, 48, 6); }
  if (i === 2) { ctx.beginPath(); ctx.moveTo(x + 42, y + 10); ctx.lineTo(x + 24, y + 38); ctx.lineTo(x + 36, y + 38); ctx.lineTo(x + 28, y + 62); ctx.lineTo(x + 50, y + 30); ctx.lineTo(x + 38, y + 30); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(x + 66, y + 6, 14, 0, 7); ctx.fillStyle = C.ink; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.gold; ctx.stroke();
  T(String(n), x + 66, y + 7, { size: 17, w: 900, align: 'center', base: 'middle', fill: C.gold, stroke: null });
});

// ---------- overlays ----------
if (mode === 'arcade') {
  // BIG CATCH banner
  ctx.save(); ctx.globalAlpha = 0.9;
  const bx = 640, by = 205;
  const rg = ctx.createRadialGradient(bx, by, 10, bx, by, 220); rg.addColorStop(0, 'rgba(255,201,60,0.55)'); rg.addColorStop(1, 'rgba(255,201,60,0)');
  ctx.fillStyle = rg; ctx.fillRect(bx - 240, by - 120, 480, 240); ctx.restore();
  T('BIG CATCH!', 640, 180, { size: 30, w: 900, align: 'center', fill: C.white, sw: 7 });
  goldText('+750', 640, 232, 72);
  for (let i = 0; i < 14; i++) { const x = 500 + R() * 280, y = 165 + R() * 120; ctx.beginPath(); ctx.ellipse(x, y, 9, 7, R(), 0, 7); ctx.fillStyle = C.gold; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#B86E00'; ctx.stroke(); }
  // Fever ribbon
  frost(470, 76, 340, 30, 12); T('HARVEST FEVER  4', 640, 98, { size: 18, w: 900, align: 'center', fill: C.lime, sw: 4 });
} else {
  // prize wheel
  ctx.fillStyle = 'rgba(4,14,26,0.55)'; ctx.fillRect(0, 0, 1280, 720);
  const wx = 640, wy = 330, r = 190;
  const seg = ['×2', '×3', '×2', '×5', '×2', '×8', '×3', '×2', '×10', '×3', '×5', '★'];
  const cols = ['#FF5E8A', '#3FE3FF', '#C6FF4A', '#FFC93C', '#9B6BFF', '#FF8A1F'];
  ctx.save(); ctx.shadowColor = C.gold; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.arc(wx, wy, r + 18, 0, 7); ctx.fillStyle = C.gold; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(wx, wy, r + 18, 0, 7); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke();
  seg.forEach((s, i) => {
    const a0 = -Math.PI / 2 + i * Math.PI * 2 / 12 - Math.PI / 12, a1 = a0 + Math.PI * 2 / 12;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.arc(wx, wy, r, a0, a1); ctx.closePath(); ctx.fillStyle = cols[i % cols.length]; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
    const am = (a0 + a1) / 2;
    ctx.save(); ctx.translate(wx + Math.cos(am) * r * 0.7, wy + Math.sin(am) * r * 0.7); ctx.rotate(am + Math.PI / 2);
    T(s, 0, 0, { size: 30, w: 900, align: 'center', base: 'middle', fill: C.white, sw: 6 }); ctx.restore();
  });
  for (let i = 0; i < 24; i++) { const a = i * Math.PI / 12; ctx.beginPath(); ctx.arc(wx + Math.cos(a) * (r + 9), wy + Math.sin(a) * (r + 9), 5, 0, 7); ctx.fillStyle = i % 2 ? C.white : '#FFF2A8'; ctx.fill(); }
