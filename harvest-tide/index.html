<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06223F">
<title>Harvest Tide</title>
<!-- Games by FC: icons, install, offline -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #06223F; overflow: hidden;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: absolute; display: block; touch-action: none; outline: none;
           -webkit-tap-highlight-color: transparent; }
  #boot-error { position: absolute; inset: 0; display: none; place-items: center; color: #F4E3C1;
                font: 600 18px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Harvest Tide game"></canvas>
<div id="boot-error">Could not start. Tap to retry.</div>
<script type="module">
  import { boot } from './src/main.js';
  boot(document.getElementById('game')).catch(err => {
    console.error(err);
    const el = document.getElementById('boot-error');
    el.style.display = 'grid';
    el.onclick = () => location.reload();
  });
</script>
<script>
/* Games by FC: lets the whole arcade work offline after the first visit */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {}); });
}
</script>
</body>
</html>
