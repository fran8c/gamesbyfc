function lionfish(ctx, p) {

function turtle(ctx, p) {

  shine(ctx, -12, -22, 18, 6, 0.35, -0.3);

function manta(ctx, p) {

function octopus_king(ctx, p) {

}

function jellyfish(ctx, p) {
  const ph = p * TAU;
  ctx.save(); ctx.shadowColor = '#FF5EC8'; ctx.shadowBlur = 18;
